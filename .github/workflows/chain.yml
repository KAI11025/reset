name: RESET 通知鏈
run-name: chain
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'   # 備用：如果鏈斷了，GitHub 排程有跑的話會把它接回來
permissions:
  actions: write
  contents: read
concurrency:
  group: chain
  cancel-in-progress: true
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i web-push@3 --no-save --no-audit --no-fund
      - run: node .github/chain.mjs
        env:
          PUSH: ${{ secrets.PUSH }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
