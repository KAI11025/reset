name: RESET 通知
on:
  schedule:
    - cron: '41 23 * * *'   # 早上 07:41 起，隨機延後 0~50 分
    - cron: '53 0 * * *'    # 早上備援 08:53
    - cron: '33 4 * * *'    # 下午 12:33 起，隨機延後 0~5 小時
    - cron: '43 5 * * *'    # 下午備援
    - cron: '7 14 * * *'    # 睡前 22:07 起，隨機延後 0~40 分
    - cron: '59 14 * * *'   # 睡前備援 22:59
  workflow_dispatch:
    inputs:
      type:
        description: 'test / morning / afternoon / night'
        default: 'test'
permissions:
  actions: read
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i web-push@3 --no-save --no-audit --no-fund
      - run: node .github/notify.mjs
        env:
          PUSH: ${{ secrets.PUSH }}
          SCHED: ${{ github.event.schedule }}
          TYPE: ${{ github.event.inputs.type }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
