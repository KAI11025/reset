name: RESET 通知
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'test / morning / afternoon / night'
        default: 'test'
permissions:
  actions: read
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i web-push@3 --no-save --no-audit --no-fund
      - run: node .github/notify.mjs
        env:
          PUSH: ${{ secrets.PUSH }}
          SCHED: ${{ github.event.schedule }}
          TYPE: ${{ github.event.inputs.type }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
