<title>RESET 系統</title>
<style>
:root{--bg:#05070d;--panel:#0b1120;--panel2:#0f1830;--line:#1c2a44;--cyan:#4fd1ff;--blue:#3b82f6;--gold:#f5c451;--red:#ff5d6c;--green:#3ee08f;--purple:#b48cff;--text:#e6eefc;--mute:#7d8aa6;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 72px);min-height:100vh;
 background:radial-gradient(ellipse at 50% -10%,rgba(59,130,246,.18),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#070c18;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
a{color:var(--cyan)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;gap:12px;padding:12px 14px 6px;max-width:560px;margin:0 auto}
.rank{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 22px var(--mono);
 border:1.5px solid var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(79,209,255,.35),inset 0 0 10px rgba(79,209,255,.15)}
.who{flex:1;min-width:0}
.who .l1{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.who .l1 b{color:var(--text);font-size:15px}
.bar{height:8px;background:#0a1222;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .5s}
.bar.red>i{background:linear-gradient(90deg,#b3263a,var(--red));box-shadow:0 0 10px var(--red)}
.bar.gold>i{background:linear-gradient(90deg,#c58b1a,var(--gold));box-shadow:none}
.gold{color:var(--gold);font-weight:700;font-family:var(--mono)}

 for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9}}catch(e){}}

/* ---------- 存檔 ---------- */
function defaults(){return{v:4,start:today(),hard:false,sound:true,badge:false,dayStart:4,gold:0,xp:0,best:0,seen:0,
 rewards:[{id:uid(),name:'追劇一集',cost:50},{id:uid(),name:'手搖飲一杯',cost:80},{id:uid(),name:'睡到自然醒',cost:120},{id:uid(),name:'放縱餐',cost:200},{id:uid(),name:'買一個想要的小東西',cost:400}],
 log:{},lastClosed:null,penalties:[],stats:{STR:0,VIT:0,INT:0,SPI:0,DIS:0},
 boss:{week:null,dmg:0,dead:false,tier:0},bossKills:0,crits:0,focusCount:0,questCount:0,sideCount:0,
 ach:{},buys:[],timer:null,shift:{},gear:{own:[],eq:{}},skills:{},login:{last:null,streak:0,best:0}}}
function load(){let d=defaults(),r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 S=r&&typeof r==='object'&&r.log?Object.assign(d,r):d;
 if(r&&r.log&&r.seen===undefined)S.seen=1;
 delete S.quests;delete S.safari;delete S.igUntil;
 S.stats=Object.assign({STR:0,VIT:0,INT:0,SPI:0,DIS:0},S.stats);if(S.stats.CHA){S.stats.SPI+=S.stats.CHA;delete S.stats.CHA}
 S.rewards=(S.rewards||[]).filter(x=>!(x.ig>0));S.shift=S.shift||{};S.gear=S.gear||{own:[],eq:{}};S.skills=S.skills||{};S.login=S.login||{last:null,streak:0,best:0};
 if(S.dayStart===undefined)S.dayStart=4;if(S.sound===undefined)S.sound=true;if(S.boss.tier===undefined)S.boss.tier=S.bossKills}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- 規則 ---------- */
const dayLog=d=>{const L=S.log[d]||(S.log[d]={});L.done=L.done||{};L.cnt=L.cnt||{};L.side=L.side||{};L.focus=L.focus||[];return L};
const isShift=d=>!!S.shift[d];
const activeOn=(q,d)=>!(q.days&&!q.days.includes(parse(d).getDay()))&&!(q.shift==='off'&&isShift(d))&&!(q.shift==='on'&&!isShift(d));
const actives=d=>QUESTS.filter(q=>activeOn(q,d));
const need=d=>Math.ceil(actives(d).length*0.8);
const doneCount=d=>{const L=S.log[d];return L&&L.done?actives(d).filter(q=>L.done[q.id]).length:0};
const cleared=d=>doneCount(d)>=need(d);
const sidesOf=d=>{const n=dayNum(d),perm=shuffleSeed(SIDE.length,'side'+Math.floor(n/16)),k=((n%16)+16)%16;return[0,1,2].map(j=>perm[k*3+j])};
function streak(){let n=0,d=today();if(cleared(d))n++;d=addDays(d,-1);while(diff(S.start,d)>=0&&cleared(d)){n++;d=addDays(d,-1)}return n}
function lvInfo(xp){let lv=1,nd=60;xp=Math.max(0,xp);while(xp>=nd){xp-=nd;lv++;nd=60+lv*25}return{lv,cur:xp,need:nd}}
const rankOf=lv=>{let r=RANKS[0];for(const x of RANKS)if(lv>=x[0])r=x;return r};
const pendingPen=()=>S.penalties.filter(p=>!p.done);
const gearById=id=>{for(const k in GEAR){const i=GEAR[k].items.findIndex(x=>x[0]===id);if(i>=0)return{slot:k,tier:i+1,it:GEAR[k].items[i]}}return null};
const eqItem=slot=>{const g=S.gear.eq[slot]&&gearById(S.gear.eq[slot]);return g?g:null};
const eqv=slot=>{const g=eqItem(slot);return g?g.it[4]:0};
const tierOf=slot=>{const g=eqItem(slot);return g?g.tier:0};
const skl=id=>S.skills[id]||0;
const critRate=()=>.15+eqv('acc');
function power(){const L=lvInfo(S.xp).lv;return L*20+Object.values(S.stats).reduce((a,b)=>a+b,0)*3+['weapon','armor','acc'].reduce((a,k)=>a+tierOf(k)*40,0)+Object.values(S.skills).reduce((a,b)=>a+b*25,0)}

function closeDays(){const t=today();let d=S.lastClosed?addDays(S.lastClosed,1):S.start;let n=0;
 while(diff(d,t)>1&&n<500){
  if(!cleared(d)&&S.hard&&pendingPen().length<3){
   S.gold=Math.max(0,S.gold-50);sfx('bad');
   S.penalties.push({id:uid(),date:d,text:PENALTY[Math.floor(Math.random()*PENALTY.length)],done:false});
   const md=d.slice(5).replace('-','/');
   setTimeout(()=>modal(`<h2>[系統警告]</h2><div class="bigt" style="color:var(--red)">${md} 任務失敗</div><p class="muted">補登期限過了。硬核模式：扣 50G，並追加懲罰任務。完成前商店鎖定。</p>`,[['收到','btn red']]),400)}
  S.lastClosed=d;d=addDays(d,1);n++}
 save()}

/* ---------- Boss ---------- */
function bossInfo(){const wk=weekKey(today());
 if(S.boss.week!==wk)S.boss={week:wk,dmg:0,dead:false,tier:S.bossKills};
 const i=((Math.round(dayNum(wk)/7)%7)+7)%7,t=S.boss.tier,hp=Math.round(700*(1+.35*t));
 return{i,t,name:(BOSS_PRE[Math.min(t,6)]?BOSS_PRE[Math.min(t,6)]+'・':'')+BOSSES[i],hp,dmg:Math.min(S.boss.dmg,hp),dead:S.boss.dead,gold:200+60*t,xp:100+30*t}}
function hitBoss(x){const b0=bossInfo();if(S.boss.dead)return;S.boss.dmg=Math.max(0,S.boss.dmg+x);
 if(S.boss.dmg>=b0.hp){S.boss.dead=true;S.bossKills++;gain(b0.xp,b0.gold);sfx('lv');
  setTimeout(()=>modal(`<h2>[BOSS 擊破]</h2><div style="text-align:center">${bossSvg(b0.i,b0.t,150,true)}</div><div class="bigt" style="text-align:center">${b0.name} 倒下了</div><p class="muted" style="text-align:center">獎勵 <span class="gold">+${b0.gold} G</span>　<b style="color:var(--cyan)">+${b0.xp} XP</b><br>下週的 Boss 會更強。</p>`,[['讚','btn pri']]),300)}}

/* ---------- 獎勵 ---------- */
function gain(xp,gold){const before=lvInfo(S.xp).lv;S.xp+=xp;S.gold+=gold;const after=lvInfo(S.xp).lv;
 if(after>before){sfx('lv');const r0=rankOf(before),r1=rankOf(after);
  setTimeout(()=>modal(`<h2>[系統] LEVEL UP</h2><div style="text-align:center">${avatarSvg(120)}</div><div class="bigt" style="text-align:center">Lv.${before} → <span style="color:var(--cyan)">Lv.${after}</span></div>${r1[1]!==r0[1]?`<p style="text-align:center">階級提升：<b style="color:var(--gold)">${r1[1]} 級・${r1[2]}</b></p>`:''}<p class="muted" style="text-align:center">${newUnlocks(before,after)}</p>`,[['繼續','btn pri']]),250)}}
function newUnlocks(a,b){const u=[];for(const k in GEAR)for(const it of GEAR[k].items)if(it[2]>a&&it[2]<=b)u.push(it[1]);return u.length?'商店解鎖：'+u.join('、'):'繼續變強。'}
function reward(t,key,base,stat,kind){let m=1;if(kind==='quest'&&skl('grit')&&streak()>=7)m+=.05*skl('grit');if(kind==='side')m+=.2*skl('curio');if(kind==='focus')m+=.25*skl('focus');
 const crit=srand(t+key+'c')<critRate(),xp=Math.round(base*m*(crit?2:1));
 const loot=srand(t+key+'l')<.1?Math.round((10+Math.floor(srand(t+key+'a')*31))*(1+.3*skl('luck'))):0;
 const gold=Math.round(base/2*(1+eqv('armor')))+loot,dmg=Math.round(xp*(1+eqv('weapon')));
 const r={xp,gold,loot,crit,stat,dmg,kind};if(crit)S.crits++;S.stats[stat]=(S.stats[stat]||0)+1;if(kind==='side')S.sideCount++;else if(kind==='quest')S.questCount++;
 gain(xp,gold);hitBoss(dmg);
 if(crit){sfx('crit');toast(`<b>CRITICAL!</b> 經驗值 ×2　+${xp} XP`,'crit')}else{sfx('done');toast(`<b>+${xp} XP</b>　+${gold-loot} G　${STATS[stat].n} +1`)}
 if(loot)toast(`<b>寶箱掉落！</b> +${loot} G`,'crit');return r}
function undo(r){S.xp-=r.xp;S.gold-=r.gold;const st=STATS[r.stat]?r.stat:'SPI';S.stats[st]=Math.max(0,(S.stats[st]||0)-1);
 if(r.kind==='side')S.sideCount--;else S.questCount--;if(r.crit)S.crits--;bossInfo();if(!S.boss.dead)S.boss.dmg=Math.max(0,S.boss.dmg-(r.dmg||r.xp))}
function settle(t,was){if(!was&&cleared(t)){if(t===today())setTimeout(()=>toast(`<b>[系統]</b> 今日任務達成，連續 ${streak()} 天 🔥`),500);
 else setTimeout(()=>toast(`<b>[系統]</b> ${t.slice(5).replace('-','/')} 補登通關`),500)}}
function toggleQuest(id,t){const q=QUESTS.find(x=>x.id===id);if(!q)return;if(q.type==='screen')return openScreen(id,t);
 const L=dayLog(t),was=cleared(t),tg=Math.max(1,+q.target||1);
 if(L.done[id]){undo(L.done[id]);delete L.done[id];L.cnt[id]=tg>1?tg-1:0}
 else if(tg>1&&(L.cnt[id]||0)+1<tg){L.cnt[id]=(L.cnt[id]||0)+1;sfx('tap')}
 else{L.cnt[id]=tg;L.done[id]=reward(t,id,q.xp,q.stat,'quest')}
 settle(t,was);after()}
function toggleSide(t,idx){const L=dayLog(t),k=String(idx);
 if(L.side[k]){undo(L.side[k]);delete L.side[k]}else L.side[k]=reward(t,'side'+idx,15,SIDE[idx][1],'side');after()}

/* ---------- 螢幕時間 ---------- */
const fmtMin=m=>`${Math.floor(m/60)}h ${pad(m%60)}m`;
function openScreen(id,t,morning,then){const q=QUESTS.find(x=>x.id===id),L=dayLog(t),v=L.scr;
 modal(`<h2>[${morning?'早安・昨日結算':'螢幕時間'}]</h2><div class="bigt">${t===today()?'今天':t.slice(5).replace('-','/')}用了多久？</div>
 <p class="muted" style="line-height:1.6">設定 → 螢幕使用時間 → 查看所有活動，點${t===today()?'今天':'昨天那條'}，看最上面的總時數。目標 ${fmtMin(q.goal)} 以內，越少 XP 越多。</p>
 <div class="row" style="white-space:nowrap"><input id="sh" style="flex:1;min-width:0" type="number" inputmode="numeric" min="0" max="24" placeholder="0" value="${v!=null?Math.floor(v/60):''}"><b>小時</b><input id="sm" style="flex:1;min-width:0" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="${v!=null?v%60:''}"><b>分</b></div>`,
 [['取消','btn',()=>then&&then()],['記錄','btn pri',()=>{if($('#sh').value||$('#sm').value)setScreen(id,t,Math.min(1440,(+$('#sh').value||0)*60+(+$('#sm').value||0)));then&&setTimeout(then,600)}]])}
function setScreen(id,t,m){const q=QUESTS.find(x=>x.id===id),L=dayLog(t),was=cleared(t),g=q.goal;L.scr=m;
 if(L.done[id]){undo(L.done[id]);delete L.done[id]}
 if(m<=g){L.done[id]=reward(t,id,Math.round(q.xp*(1+Math.min(1,(g-m)/g))),q.stat,'quest');if(m<=g/2)setTimeout(()=>toast('<b>[系統]</b> 比目標少一半以上，XP 加成拉滿'),400)}
 else{sfx('bad');toast(`超標 ${m-g} 分鐘，明天再拚`)}
 settle(t,was);after()}
function askScreen(){const t=today(),y=addDays(t,-1);if(S.asked===t||diff(S.start,y)<0)return;const q=QUESTS.find(q=>q.type==='screen'&&activeOn(q,y));
 if(!q||(S.log[y]&&S.log[y].scr!=null))return;S.asked=t;save();setTimeout(()=>openScreen(q.id,y,true),400)}

/* ---------- 每日簽到 ---------- */
function openChest(big){const lk=1+.3*skl('luck');
 if(big){const pool=[];for(const k in GEAR)GEAR[k].items.slice(0,2).forEach(it=>{if(!S.gear.own.includes(it[0]))pool.push(it)});
  if(pool.length&&Math.random()<.5){const it=pool[Math.floor(Math.random()*pool.length)];giveGear(it[0]);return{ic:'🗡️',txt:`稀有掉落：<b style="color:var(--gold)">${it[1]}</b>`}}
  const g=Math.round((150+Math.floor(Math.random()*101))*lk);S.gold+=g;return{ic:'💰',txt:`<span class="gold">+${g} G</span>`}}
 if(Math.random()<.3){const x=25+Math.floor(Math.random()*16);gain(x,0);return{ic:'✨',txt:`<b style="color:var(--cyan)">+${x} XP</b>`}}
 const g=Math.round((30+Math.floor(Math.random()*41))*lk);S.gold+=g;return{ic:'💰',txt:`<span class="gold">+${g} G</span>`}}
function checkLogin(then){const t=today();if(S.login.last===t)return false;const y=addDays(t,-1);
 S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=t;S.login.best=Math.max(S.login.best||0,S.login.streak);
 const k=(S.login.streak-1)%7,r=LOGIN[k];let res;
 if(r[0]==='g'){const g=Math.round(r[1]*(1+eqv('armor')));S.gold+=g;res={ic:'💰',txt:`<span class="gold">+${g} G</span>`}}else res=openChest(r[0]==='C');
 sfx('chest');checkAch();save();
 const cal=LOGIN.map((x,i)=>`<div class="cd ${i<k?'got':i===k?'now':''}"><small>D${i+1}</small><span>${x[0]==='g'?'💰':x[0]==='c'?'🎁':'👑'}</span><small>${x[0]==='g'?x[1]+'G':x[0]==='c'?'寶箱':'大寶箱'}</small></div>`).join('');
 modal(`<h2>[每日簽到] 連續 ${S.login.streak} 天</h2><div class="cal">${cal}</div><div class="chestbox"><div class="chest">${r[0]==='g'?'💰':'🎁'}</div><div class="reveal"><div style="font-size:44px">${res.ic}</div><div class="bigt" style="font-size:22px">${res.txt}</div></div></div><p class="muted" style="text-align:center;margin:0">斷簽會從第 1 天重來。第 7 天大寶箱有機會開出裝備。</p>`,[['收下','btn pri',()=>{render();then&&then()}]]);
 return true}

/* ---------- 裝備 / 技能 ---------- */
function giveGear(id){if(!S.gear.own.includes(id))S.gear.own.push(id);const g=gearById(id);if(g.tier>tierOf(g.slot))S.gear.eq[g.slot]=id}
function buyGear(id){const g=gearById(id),L=lvInfo(S.xp).lv;if(pendingPen().length)return toast('先完成懲罰任務');if(L<g.it[2])return toast(`Lv.${g.it[2]} 才能用`);if(S.gold<g.it[3])return toast('金幣不夠，回去解任務');
 modal(`<h2>[武器店]</h2><div class="bigt">${g.it[1]}</div><p>${GEAR[g.slot].eff} <b style="color:var(--cyan)">+${Math.round(g.it[4]*100)}%</b>　花費 <span class="gold">${g.it[3]} G</span></p>`,[['算了','btn'],['買','btn pri',()=>{
  S.gold-=g.it[3];S.buys.unshift({t:Date.now(),name:g.it[1],cost:g.it[3]});giveGear(id);S.gear.eq[g.slot]=id;after();sfx('lv');
  modal(`<h2>[裝備完成]</h2><div style="text-align:center">${avatarSvg(150)}</div><div class="bigt" style="text-align:center">${g.it[1]}</div><p class="muted" style="text-align:center">戰力 ${power()}</p>`,[['帥','btn pri']])}]])}
function buySkill(id){const lv=skl(id);if(lv>=3)return;const c=SKILL_COST[lv];if(pendingPen().length)return toast('先完成懲罰任務');if(S.gold<c)return toast('金幣不夠');
 const sk=SKILLS.find(x=>x[0]===id);modal(`<h2>[技能升級]</h2><div class="bigt">${sk[1]} ${sk[2]} Lv.${lv+1}</div><p>${sk[3](lv+1)}</p><p>花費 <span class="gold">${c} G</span></p>`,[['算了','btn'],['升級','btn pri',()=>{S.gold-=c;S.skills[id]=lv+1;S.buys.unshift({t:Date.now(),name:`${sk[2]} Lv.${lv+1}`,cost:c});after();sfx('lv');toast(`<b>技能升級</b>　${sk[2]} Lv.${lv+1}`)}]])}

function checkAch(){for(const a of ACH)if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=Date.now();setTimeout(()=>toast(`<b>🏆 成就解鎖</b>　${a[1]} ${a[2]}`,'crit'),700)}}

/* ---------- 圖像 ---------- */
function avatarSvg(w){const tw=tierOf('weapon'),ta=tierOf('armor'),tr=tierOf('acc'),rk=rankOf(lvInfo(S.xp).lv)[1],au=AURA[rk],gid='g'+Math.random().toString(36).slice(2,6);
 const ac=['#3a4660','#b08d5b','#7a5233','#9aa6b6','#1f3a6b','#17111f'][ta],tc=['#55617d','#e2c89c','#a0703f','#e6eefc','#4fd1ff','#b48cff'][ta],sk='#e8c4a0';

 if(ta>=4)s+=`<path d="M54 80 L36 176 Q80 168 124 176 L106 80Z" fill="${ta===5?'#2a0f3a':'#10203d'}" stroke="${tc}" stroke-width="1" opacity=".95"/>`;
 s+=`<rect x="64" y="128" width="13" height="46" rx="5" fill="#1b2233"/><rect x="83" y="128" width="13" height="46" rx="5" fill="#1b2233"/><rect x="61" y="168" width="18" height="10" rx="4" fill="#0b0e15"/><rect x="81" y="168" width="18" height="10" rx="4" fill="#0b0e15"/>`;
 s+=`<rect x="43" y="82" width="12" height="40" rx="6" fill="${ac}" stroke="${tc}" stroke-width="1.5"/><rect x="105" y="82" width="12" height="40" rx="6" fill="${ac}" stroke="${tc}" stroke-width="1.5"/>`;

 const s1=avg(0,7),s0=avg(7,14);
 if(s1!=null)h+=`<div class="rd"><span class="nm">螢幕時間（日均）</span><b>${fmtMin(s1)}</b><span class="dl ${s0!=null&&s1<s0?'up':s0!=null&&s1>s0?'dn':''}">${s0==null?'—':s1<s0?'▼'+(s0-s1)+'m':s1>s0?'▲'+(s1-s0)+'m':'—'}</span><span class="muted">${s0!=null?'上週 '+fmtMin(s0):''}</span></div>`;
 h+=`<div class="rd"><span class="nm">隨機任務</span><b>${S.sideCount}</b><span class="dl"></span><span class="muted">累計個</span></div>`;
 return h+`<p class="muted" style="margin:6px 0 0;font-size:12px">▲ 綠色 = 比上週進步（螢幕時間是越少越好）</p></div>`}
function scrChart(){const g=180,t=today(),days=[];for(let i=6;i>=0;i--){const d=addDays(t,-i);days.push([d,S.log[d]&&S.log[d].scr])}
 if(!days.some(x=>x[1]!=null))return'';const mx=Math.max(g*1.3,...days.map(x=>x[1]||0)),H=110,W=300,bw=30;
 let svg=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%">`;days.forEach(([d,v],i)=>{const x=12+i*41;if(v!=null){const hh=v/mx*H;svg+=`<rect x="${x}" y="${H-hh}" width="${bw}" height="${hh}" rx="5" fill="${v<=g?'#4fd1ff':'#ff5d6c'}" opacity=".85"/><text x="${x+bw/2}" y="${H-hh-4}" fill="#e6eefc" font-size="10" text-anchor="middle">${(v/60).toFixed(1)}</text>`}svg+=`<text x="${x+bw/2}" y="${H+16}" fill="#7d8aa6" font-size="11" text-anchor="middle">${WD[parse(d).getDay()]}</text>`});
 const gy=H-g/mx*H;return`<div class="panel"><div class="ptitle">[螢幕時間]<span>近 7 天（小時）</span></div>${svg}<line x1="4" x2="${W-4}" y1="${gy}" y2="${gy}" stroke="#f5c451" stroke-dasharray="4 4"/></svg></div>`.replace('</svg><line','<line')}
function rates(){const t=today();const rows=QUESTS.map(q=>{let a=0,d=0;for(let i=0;i<14;i++){const x=addDays(t,-i);if(diff(S.start,x)<0)break;if(!activeOn(q,x))continue;const ok=S.log[x]&&S.log[x].done&&S.log[x].done[q.id];if(i===0&&!ok)continue;a++;if(ok)d++}return[q,a?d/a:null]}).filter(r=>r[1]!==null);
 if(!rows.length)return'';rows.sort((x,y)=>x[1]-y[1]);
 return`<div class="panel"><div class="ptitle">[任務完成率]<span>近 14 天・弱點在上面</span></div>${rows.map(([q,p])=>`<div class="rate"><span class="nm">${esc(q.name)}</span><div class="bar ${p<.5?'red':''}"><i style="width:${p*100}%"></i></div><span class="muted" style="width:40px;text-align:right">${Math.round(p*100)}%</span></div>`).join('')}</div>`}
function vMe(){const L=lvInfo(S.xp),r=rankOf(L.lv),nx=RANKS.find(x=>x[0]>L.lv);
 let h=`<div class="panel sys" style="text-align:center"><div class="ptitle">[狀態欄]<span>${esc(S.start)} 開始</span></div>
 <div class="avatar">${avatarSvg(180)}</div>
 <div style="font-size:20px;font-weight:800"><span style="color:${AURA[r[1]]}">${r[1]} 級</span>・Lv.${L.lv} ${r[2]}</div>
 <div class="pw">戰力 <b>${power()}</b></div><p class="muted" style="margin:4px 0 10px">${nx?`Lv.${nx[0]} 晉升 ${nx[1]} 級`:'已達最高階級'}</p>
 <div class="eqrow">${['weapon','armor','acc'].map(k=>{const g=eqItem(k);return`<div><span>${g?gearIcon(k,g.tier):'—'}</span><small>${GEAR[k].n}</small><b>${g?g.it[1]:'空'}</b></div>`}).join('')}</div>
 ${radar()}<div class="stats">${Object.keys(STATS).map(k=>`<div><b style="color:${STATS[k].c}">${S.stats[k]||0}</b><span class="muted">${STATS[k].n}</span></div>`).join('')}</div></div>`;
 h+=realData()+scrChart()+rates();
 h+=`<div class="panel"><div class="ptitle">[戰績]</div><div class="stats" style="grid-template-columns:repeat(4,1fr)"><div><b>${S.questCount}</b><span class="muted">任務</span></div><div><b>${S.best||0}</b><span class="muted">最佳連續</span></div><div><b>${S.bossKills}</b><span class="muted">Boss</span></div><div><b>${S.crits}</b><span class="muted">暴擊</span></div></div></div>`;
 h+=`<div class="panel"><div class="ptitle">[成就]<span>${Object.keys(S.ach).length}/${ACH.length}</span></div><div class="ach">${ACH.map(a=>`<div class="${S.ach[a[0]]?'':'off'}"><b>${a[1]}</b>${a[2]}<div class="muted" style="font-size:10px;margin-top:2px">${a[3]}</div></div>`).join('')}</div></div>`;
 return h}

/* ---------- 設定頁 ---------- */
function vSet(){let h=`<div class="panel sys"><div class="ptitle">[任務]<span>後台管理</span></div><p class="muted" style="margin:0;line-height:1.7">任務清單鎖在後台，不能在這裡改，免得一時懶就把任務調簡單。想調整就跟 Claude 說，說「改我的 RESET 系統」。</p></div>`;
 h+=`<div class="panel"><div class="ptitle">[現實獎勵]<span>名稱 / 價格</span></div>`+S.rewards.map(r=>`<div class="edit rw" data-er="${r.id}"><input value="${esc(r.name)}" data-f="name"><input type="number" inputmode="numeric" value="${r.cost}" data-f="cost"><button data-delr="${r.id}">✕</button></div>`).join('')+`<button class="btn sm cy" id="addr" style="margin-top:4px">＋ 新增獎勵</button></div>`;
 h+=`<div class="panel"><div class="ptitle">[模式]</div>
 <div class="sw"><div><b>😈 硬核模式</b><div class="muted">沒通關（含補登期限）扣 50G＋懲罰任務，做完才能用商店</div></div><button class="tog ${S.hard?'on':''}" id="tHard"></button></div>
 <div class="sw"><div><b>🔊 音效</b><div class="muted">iPhone 靜音時不會響</div></div><button class="tog c ${S.sound?'on':''}" id="tSnd"></button></div>
 <div class="sw"><div><b>🌙 一天從幾點開始</b><div class="muted">凌晨勾的任務算前一天</div></div><select id="dayStart" style="width:90px">${[0,2,3,4,5,6].map(x=>`<option value="${x}" ${S.dayStart===x?'selected':''}>${pad(x)}:00</option>`).join('')}</select></div>
 <div class="sw"><div><b>🔴 圖示顯示剩幾項</b><div class="muted">要先加到主畫面，打開 app 時更新</div></div><button class="tog c ${S.badge?'on':''}" id="tBadge"></button></div></div>
 <div class="panel"><div class="ptitle">[每日提醒]<span>用 iPhone 捷徑</span></div><p class="muted" style="line-height:1.7;margin:0">捷徑 → 自動化 → ＋ → 特定時間 → 立即執行 → 動作「打開 URL」→ 貼上網址。建議早上一個、22:00 一個。</p><button class="btn sm cy" id="cpUrl" style="width:100%;margin-top:10px">複製這個 app 的網址</button></div>
 <div class="panel"><div class="ptitle">[備份]<span>換手機前一定要做</span></div><div class="row"><button class="btn sm cy grow" id="exp">匯出（複製）</button><button class="btn sm grow" id="imp">匯入</button></div>
 <textarea id="bk" class="hide" style="margin-top:8px"></textarea><button class="btn sm pri hide" id="impGo" style="margin-top:6px;width:100%">確認匯入</button></div>
 <div class="panel"><div class="ptitle" style="color:var(--red)">[危險區]</div><div class="row"><button class="btn sm grow" id="restart">重開 66 天（保留等級）</button><button class="btn sm red grow" id="wipe">全部清空</button></div></div>`;
 return h}

const VIEWS={today:vToday,battle:vBattle,shop:vShop,me:vMe,set:vSet};
function render(){header();$('#view').innerHTML=VIEWS[tab]();tick()}

/* ---------- 事件 ---------- */
$('#view').addEventListener('click',e=>{const el=e.target.closest('[data-q],[data-side],[data-day],[data-shift],[data-pen],[data-focus],[data-buy],[data-gear],[data-eq],[data-skill],[data-delr],button[id]');if(!el||el.disabled)return;const d=el.dataset;
 const D=viewY?addDays(today(),-1):today();
 if(d.q)return toggleQuest(d.q,D);
 if(d.side)return toggleSide(D,+d.side);
 if(d.day){viewY=d.day==='y';return render()}
 if(d.shift!==undefined){if(d.shift==='1')S.shift[D]=1;else delete S.shift[D];return after()}
 if(d.gear)return buyGear(d.gear);
 if(d.eq){const g=gearById(d.eq);S.gear.eq[g.slot]=d.eq;sfx('tap');return after()}
 if(d.skill)return buySkill(d.skill);
 if(d.pen){const p=S.penalties.find(x=>x.id===d.pen);return modal(`<h2>[懲罰任務]</h2><div class="bigt">${esc(p.text)}</div><p class="muted">誠實點，真的做完了？</p>`,[['還沒','btn'],['做完了','btn red',()=>{p.done=true;toast('<b>[系統]</b> 懲罰解除，商店開放');after()}]])}
 if(d.focus){S.timer={end:Date.now()+d.focus*6e4,min:+d.focus};save();toast(`<b>[專注地城]</b> 進入 ${d.focus} 分鐘`);return render()}
 if(d.buy){const r=S.rewards.find(x=>x.id===d.buy);if(!r)return;if(pendingPen().length)return toast('先完成懲罰任務');if(S.gold<r.cost)return toast('金幣不夠');
  return modal(`<h2>[確認購買]</h2><div class="bigt">${esc(r.name)}</div><p>花費 <span class="gold">${r.cost} G</span>，剩 <span class="gold">${S.gold-r.cost} G</span></p>`,[['算了','btn'],['買','btn pri',()=>{S.gold-=r.cost;S.buys.unshift({t:Date.now(),name:r.name,cost:r.cost});S.buys=S.buys.slice(0,50);after();sfx('lv');toast(`<b>已購買</b>　${esc(r.name)}，去享受吧`)}]])}
 if(d.delr){S.rewards=S.rewards.filter(q=>q.id!==d.delr);save();return render()}
 switch(el.id){
  case'giveup':return modal('<h2>[專注地城]</h2><div class="bigt">確定逃跑？</div><p class="muted">不會有任何獎勵。</p>',[['繼續撐','btn pri'],['逃跑','btn red',()=>{S.timer=null;save();render()}]]);
  case'addr':S.rewards.push({id:uid(),name:'新獎勵',cost:50});save();return render();
  case'tHard':S.hard=!S.hard;if(S.hard)S.lastClosed=addDays(today(),-1);return after();
  case'tSnd':S.sound=!S.sound;save();sfx('done');return render();
  case'tBadge':{if(!('setAppBadge'in navigator)){toast('這裡不支援，先「加入主畫面」再從主畫面打開');return}
   const on=()=>{S.badge=true;save();updBadge();render();toast('<b>已開啟</b>')};
   if(S.badge){S.badge=false;try{navigator.clearAppBadge()}catch(e){}save();return render()}
   try{if(window.Notification&&Notification.permission!=='granted')Notification.requestPermission().then(p=>p==='granted'?on():toast('要允許通知才能顯示數字'));else on()}catch(e){on()}return}
  case'cpUrl':{const u=location.href.split('#')[0];try{navigator.clipboard.writeText(u).then(()=>toast('<b>已複製</b>　'+esc(u)),()=>toast(esc(u)))}catch(e){toast(esc(u))}return}
  case'exp':{const t=$('#bk');t.classList.remove('hide');$('#impGo').classList.add('hide');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('<b>已複製</b>　貼到備忘錄存起來'),()=>toast('請手動複製下面的文字'))}catch(err){toast('請手動複製下面的文字')}return}
  case'imp':{const t=$('#bk');t.classList.remove('hide');t.value='';t.placeholder='把備份文字貼在這';$('#impGo').classList.remove('hide');return}
  case'impGo':try{const o=JSON.parse($('#bk').value);if(!o.log)throw 0;localStorage.setItem(KEY,JSON.stringify(o));load();save();toast('<b>匯入成功</b>');render()}catch(err){toast('格式不對，確認有整段貼上')}return;
  case'restart':return modal('<h2>[重開計畫]</h2><div class="bigt">從 DAY 1 重新開始？</div><p class="muted">等級、金幣、裝備、成就保留，66 天進度歸零。</p>',[['取消','btn'],['重開','btn pri',()=>{S.start=today();S.lastClosed=null;S.penalties=[];save();render()}]]);
  case'wipe':return modal('<h2>[警告]</h2><div class="bigt" style="color:var(--red)">全部清空？</div><p class="muted">無法復原。建議先匯出備份。</p>',[['取消','btn'],['清空','btn red',()=>{S=defaults();S.seen=1;save();render()}]]);
 }});
$('#view').addEventListener('change',e=>{if(e.target.id==='dayStart'){S.dayStart=+e.target.value;save();return render()}
 const f=e.target.dataset.f,re=e.target.closest('[data-er]');if(!f||!re)return;const r=S.rewards.find(x=>x.id===re.dataset.er);r[f]=f==='name'?e.target.value:Math.max(0,+e.target.value||0);save()});

/* ---------- 計時 ---------- */
function tick(){const tm=S.timer;if(!tm)return;const left=tm.end-Date.now();
 if(left<=0){S.timer=null;const t=today(),r=reward(t,'focus'+Date.now(),Math.round(tm.min*.8),'INT','focus');S.focusCount++;dayLog(t).focus.push({min:tm.min,xp:r.xp});after();
  modal(`<h2>[專注地城] 通關</h2><div class="bigt">${tm.min} 分鐘專注完成</div><p><b style="color:var(--cyan)">+${r.xp} XP</b>　<span class="gold">+${r.gold} G</span>　智力 +1</p>`,[['讚','btn pri']]);return}
 const el=$('#tmr');if(el){const s=Math.ceil(left/1e3);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}}
setInterval(tick,1000);
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();closeDays();render();checkLogin(askScreen)}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.seen){closeDays();render();if(!$('#modal').classList.contains('on')&&!checkLogin(askScreen))askScreen()}});

/* ---------- 啟動 ---------- */
closeDays();bossInfo();checkAch();save();render();updBadge();
try{if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
if(!S.seen)modal(`<h2>[系統] 玩家覺醒</h2><div style="text-align:center">${avatarSvg(130)}</div><div class="bigt" style="text-align:center">歡迎來到 RESET</div><p class="muted" style="line-height:1.7">每天完成 80% 任務 = 通關。<br>任務 → XP 升級、金幣買裝備和技能。<br>每週一隻 Boss，打倒一隻下一隻更強。<br>每天簽到開寶箱，還有 3 個隨機任務。<br>有上班的日子記得切「有班」。</p>`,[['開始','btn pri',()=>{S.seen=1;save();checkLogin(askScreen)}]]);
else if(!checkLogin(askScreen))askScreen();

</script>
</body>
</html>
