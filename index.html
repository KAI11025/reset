<title>RESET 系統</title>
<style>
:root{--bg:#05070d;--panel:#0b1120;--panel2:#0f1830;--line:#1c2a44;--cyan:#4fd1ff;--blue:#3b82f6;--gold:#f5c451;--red:#ff5d6c;--green:#3ee08f;--purple:#b48cff;--text:#e6eefc;--mute:#7d8aa6;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 72px);min-height:100vh;
 background:radial-gradient(ellipse at 50% -10%,rgba(59,130,246,.18),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#070c18;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
a{color:var(--cyan)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;gap:12px;padding:12px 14px 6px;max-width:560px;margin:0 auto}
.rank{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 22px var(--mono);
 border:1.5px solid var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(79,209,255,.35),inset 0 0 10px rgba(79,209,255,.15)}
.who{flex:1;min-width:0}
.who .l1{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.who .l1 b{color:var(--text);font-size:15px}
.bar{height:8px;background:#0a1222;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .5s}
.bar.red>i{background:linear-gradient(90deg,#b3263a,var(--red));box-shadow:0 0 10px var(--red)}
.bar.gold>i{background:linear-gradient(90deg,#c58b1a,var(--gold));box-shadow:none}
.gold{color:var(--gold);font-weight:700;font-family:var(--mono)}

function sfx(type){if(!S||!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={tap:[[660,.06]],done:[[660,.07],[990,.1]],crit:[[880,.06],[1320,.06],[1760,.14]],lv:[[523,.1],[659,.1],[784,.1],[1047,.25]],bad:[[220,.2],[160,.3]],chest:[[392,.08],[523,.08],[659,.08],[784,.08],[1047,.2]]}[type]||[[660,.06]];let t=AC.currentTime;
 for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9}}catch(e){}}

 S.rewards=(S.rewards||[]).filter(x=>!(x.ig>0));const RP={'追劇一集':[50,120],'手搖飲一杯':[80,150],'睡到自然醒':[120,250],'放縱餐':[200,400],'買一個想要的小東西':[400,1000]};S.rewards.forEach(r=>{const p=RP[r.name];if(p&&r.cost===p[0])r.cost=p[1]});S.shift=S.shift||{};S.gear=S.gear||{own:[],eq:{}};S.skills=S.skills||{};S.login=S.login||{last:null,streak:0,best:0};
 if(!S.d0fix){if(S.start==='2026-11-19')S.start='2026-11-20';S.d0fix=1}
 if(S.dayStart===undefined)S.dayStart=4;if(S.sound===undefined)S.sound=true;if(S.boss.tier===undefined)S.boss.tier=S.bossKills}

/* ---------- 規則 ---------- */
const dayLog=d=>{const L=S.log[d]||(S.log[d]={});L.done=L.done||{};L.cnt=L.cnt||{};L.side=L.side||{};L.focus=L.focus||[];return L};
const isShift=d=>!!S.shift[d];
const activeOn=(q,d)=>!(q.days&&!q.days.includes(parse(d).getDay()))&&!(q.shift==='off'&&isShift(d))&&!(q.shift==='on'&&!isShift(d));
const actives=d=>QUESTS.filter(q=>activeOn(q,d));
const need=d=>Math.ceil(actives(d).length*0.75);
const doneCount=d=>{const L=S.log[d];return L&&L.done?actives(d).filter(q=>L.done[q.id]).length:0};
const cleared=d=>doneCount(d)>=need(d);
const sidesOf=d=>{const n=dayNum(d),C=Math.floor(SIDE.length/3),perm=shuffleSeed(SIDE.length,'side'+Math.floor(n/C)),k=((n%C)+C)%C;return[0,1,2].map(j=>perm[k*3+j])};
// 原子習慣「不要連續錯過兩次」：錯過一天不斷連勝，連續兩天才斷
function streak(){if(diff(S.start,today())<0)return 0;let n=0,miss=0,d=today();if(cleared(d))n++;d=addDays(d,-1);
 while(diff(S.start,d)>=0){if(cleared(d)){n++;miss=0}else if(++miss>=2)break;d=addDays(d,-1)}return n}
const yMissed=()=>{const y=addDays(today(),-1);return diff(S.start,y)>=0&&!cleared(y)};
function lvInfo(xp){let lv=1,nd=115;xp=Math.max(0,xp);while(xp>=nd){xp-=nd;lv++;nd=80+lv*35}return{lv,cur:xp,need:nd}}
const rankOf=lv=>{let r=RANKS[0];for(const x of RANKS)if(lv>=x[0])r=x;return r};
const pendingPen=()=>S.penalties.filter(p=>!p.done);
const gearById=id=>{for(const k in GEAR){const i=GEAR[k].items.findIndex(x=>x[0]===id);if(i>=0)return{slot:k,tier:i+1,it:GEAR[k].items[i]}}return null};
const eqItem=slot=>{const g=S.gear.eq[slot]&&gearById(S.gear.eq[slot]);return g?g:null};
const eqv=slot=>{const g=eqItem(slot);return g?g.it[4]:0};
const tierOf=slot=>{const g=eqItem(slot);return g?g.tier:0};
const skl=id=>S.skills[id]||0;
const critRate=()=>.15+eqv('acc');
function power(){const L=lvInfo(S.xp).lv;return L*20+Object.values(S.stats).reduce((a,b)=>a+b,0)*3+['weapon','armor','acc'].reduce((a,k)=>a+tierOf(k)*40,0)+Object.values(S.skills).reduce((a,b)=>a+b*25,0)}

function closeDays(){const t=today();let d=S.lastClosed?addDays(S.lastClosed,1):S.start;let n=0;
 while(diff(d,t)>1&&n<500){
  if(!cleared(d)&&S.hard&&pendingPen().length<3){
   S.gold=Math.max(0,S.gold-50);sfx('bad');
   S.penalties.push({id:uid(),date:d,text:PENALTY[Math.floor(Math.random()*PENALTY.length)],done:false});jlog('⚠️',`${d.slice(5).replace('-','/')} 沒通關，被罰 50G，懲罰任務：${S.penalties[S.penalties.length-1].text}`);
   const md=d.slice(5).replace('-','/');
   setTimeout(()=>modal(`<h2>[系統警告]</h2><div class="bigt" style="color:var(--red)">${md} 任務失敗</div><p class="muted">補登期限過了。硬核模式：扣 50G，並追加懲罰任務。完成前商店鎖定。</p>`,[['收到','btn red']]),400)}
  S.lastClosed=d;d=addDays(d,1);n++}
 save()}

function autoEquip(slot){let best=null;for(const id of S.gear.own){const g=gearById(id);if(g.slot===slot&&(!best||g.tier>best.tier))best=g}if(best)S.gear.eq[slot]=best.it[0];else delete S.gear.eq[slot]}
function bossLost(p,now){const B=BOSS[p.idx];let msg;const eq=['weapon','armor','acc'].map(k=>S.gear.eq[k]).filter(Boolean);
 if(eq.length&&!S.stolen){const id=eq[Math.floor(Math.random()*eq.length)],gg=gearById(id);S.gear.own=S.gear.own.filter(x=>x!==id);autoEquip(gg.slot);S.stolen=id;jlog('☠️',`敗給 ${B.n}，「${gg.it[1]}」被搶走了`);msg=`${B.n}搶走了你的 <b style="color:var(--red)">${gg.it[1]}</b>。<br>這週牠會再來，打倒牠就能搶回來。`}
 else{const gl=Math.min(300,Math.round(S.gold*.3));S.gold-=gl;jlog('☠️',`敗給 ${B.n}，被搶走 ${gl} G`);msg=`被搶走 <span class="gold">${gl} G</span>。<br>這週牠會再來，難度不變。`}
 const plain=msg.split('<br>')[0].replace(/<[^>]+>/g,'');if(now)return plain;
 S.pendingMsg=`<h2>[敗北]</h2><div style="text-align:center">${bossSvg(p.idx,p.tier,170)}</div><div class="bigt" style="color:var(--red);text-align:center">上週沒有挑戰 ${B.n}</div><p class="muted" style="text-align:center;line-height:1.7">週末沒去決戰，算棄權。<br>${msg}</p>`;return plain}
function bossInfo(){const wk=weekKey(today());
 if(S.boss.idx===undefined)S.boss.idx=((Math.round(dayNum(S.boss.week||wk)/7)%7)+7)%7;
 if(S.boss.week!==wk){const p=S.boss,nb=(idx,tier,re)=>{S.boss={week:wk,idx,tier,dmg:0,dead:false,fought:false,rematch:!!re};S.chap=S.chap||{};S.chap[wk]=BOSS[idx].n};if(p.week&&p.idx!==undefined)weekReport(p);
  if(!p.week)nb(p.idx,S.bossKills);

 const B=BOSS[S.boss.idx],t=S.boss.tier,hp=Math.round(600*(1+.28*t)),pre=BOSS_PRE[Math.min(t,6)];
 return{i:S.boss.idx,t,name:(pre?pre+'・':'')+B.n,title:B.t,hp,dmg:Math.min(S.boss.dmg,hp),dead:S.boss.dead,rematch:S.boss.rematch,gold:200+60*t,xp:100+30*t}}

function gain(xp,gold){const before=lvInfo(S.xp).lv;S.xp+=xp;S.gold+=gold;const after=lvInfo(S.xp).lv;
 if(after>before){sfx('lv');const r0=rankOf(before),r1=rankOf(after);jlog('⬆️',`升到 Lv.${after}`);if(r1[1]!==r0[1])jlog('👑',`晉升 ${r1[1]} 級・${r1[2]}`);
  setTimeout(()=>modal(`<h2>[系統] LEVEL UP</h2><div style="text-align:center">${avatarSvg(120)}</div><div class="bigt" style="text-align:center">Lv.${before} → <span style="color:var(--cyan)">Lv.${after}</span></div>${r1[1]!==r0[1]?`<p style="text-align:center">階級提升：<b style="color:var(--gold)">${r1[1]} 級・${r1[2]}</b></p>`:''}<p class="muted" style="text-align:center">${newUnlocks(before,after)}</p>`,[['繼續','btn pri']]),250)}}
function newUnlocks(a,b){const u=[];for(const k in GEAR)for(const it of GEAR[k].items)if(it[2]>a&&it[2]<=b)u.push(it[1]);return u.length?'商店解鎖：'+u.join('、'):'繼續變強。'}
function reward(t,key,base,stat,kind){let m=1;if(kind==='quest'&&skl('grit')&&streak()>=7)m+=.05*skl('grit');if(kind==='side')m+=.2*skl('curio');if(kind==='focus')m+=.25*skl('focus');
 const crit=srand(t+key+'c')<critRate(),xp=Math.round(base*m*(crit?2:1));
 const loot=srand(t+key+'l')<.1?Math.round((10+Math.floor(srand(t+key+'a')*31))*(1+.3*skl('luck'))):0;
 const gold=Math.round(base/2*(1+eqv('armor')))+loot,dmg=Math.round(xp*(1+eqv('weapon')));
 const r={xp,gold,loot,crit,stat,dmg,kind};if(crit)S.crits++;S.stats[stat]=(S.stats[stat]||0)+1;if(kind==='side')S.sideCount++;else if(kind==='quest')S.questCount++;
 gain(xp,gold);hitMinion(dmg,kind,stat);
 if(crit){sfx('crit');toast(`<b>CRITICAL!</b> 經驗值 ×2　+${xp} XP`,'crit')}else{sfx('done');toast(`<b>+${xp} XP</b>　+${gold-loot} G　${STATS[stat].n} +1`)}
 if(loot)toast(`<b>寶箱掉落！</b> +${loot} G`,'crit');return r}
function undo(r){S.xp-=r.xp;S.gold-=r.gold;const st=STATS[r.stat]?r.stat:'SPI';S.stats[st]=Math.max(0,(S.stats[st]||0)-1);
 if(r.kind==='side')S.sideCount--;else if(r.kind==='quest')S.questCount--;if(r.crit)S.crits--;dun();S.dun.dmg=Math.max(0,S.dun.dmg-(r.dmg||r.xp))}
function settle(t,was){if(!was&&cleared(t)){if(t===today())setTimeout(()=>toast(`<b>[系統]</b> 今日任務達成，連續 ${streak()} 天 🔥`),500);
 else setTimeout(()=>toast(`<b>[系統]</b> ${t.slice(5).replace('-','/')} 補登通關`),500)}}
function doLevel(q,t,i){const was=cleared(t),L=dayLog(t);const r=reward(t,q.id+'L'+i,Math.round(q.xp*ELV[i][1]),q.stat,'quest');r.lv=i;r.amt=q.amt?q.amt[i]:1;L.done[q.id]=r;settle(t,was);after()}

function guideHtml(G){const p=x=>esc(x).replace(/\n/g,'<br>');return(G.why?`<div class="gd"><h4>為什麼要做</h4><p>${p(G.why)}</p></div>`:'')+(G.how?`<div class="gd"><h4>怎麼做</h4><ol>${G.how.map(x=>`<li>${p(x)}</li>`).join('')}</ol></div>`:'')+(G.when?`<div class="gd"><h4>什麼時候做</h4><p>${p(G.when)}</p></div>`:'')+(G.ex?`<div class="gd ex"><h4>例子</h4><p>${p(G.ex)}</p></div>`:'')+(G.tip?`<div class="gd"><h4>小提醒</h4><p>${p(G.tip)}</p></div>`:'')}
function openInfo(k,D){const[kind,key]=k.split(':'),L=dayLog(D);
 if(kind==='q'){const q=QUESTS.find(x=>x.id===key),G=GUIDE[key]||{why:q.hint},d=L.done[key];
  let h=`<h2>[任務說明]</h2><div class="bigt" style="font-size:22px">${q.type==='screen'?'📱 ':''}${esc(q.name)}</div><div class="row" style="gap:8px;margin:0 0 10px">${tag(q.stat)}<span class="muted" style="font:12px var(--mono)">${q.lv?`+${Math.round(q.xp*.5)}~${Math.round(q.xp*1.6)} XP`:`+${q.xp} XP`}${q.days?'・週'+q.days.map(x=>WD[x]).join(''):''}</span></div>`+guideHtml(G);
  if(q.type==='screen')return modal(h,[['關閉','btn'],[L.scr!=null?'修改時數':'輸入時數','btn pri',()=>openScreen(key,D)]]);
  if(d)return modal(h+`<p class="muted" style="text-align:center">已完成${d.lv!=null&&q.lv?`：${ELV[d.lv][0]}・${esc(q.lv[d.lv])}`:''}</p>`,[['關閉','btn'],['取消完成','btn red',()=>toggleQuest(key,D)]]);
  if(q.lv){modal(h+`<div class="gd"><h4>今天做到哪一段？迷你也算完成</h4></div>`+lvButtons(q),[['關閉','btn']]);
   $('#mcard').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;$('#modal').classList.remove('on');$('#mcard').onclick=null;doLevel(q,D,+b.dataset.pick)};return}
  return modal(h,[['關閉','btn'],['完成 ✓','btn pri',()=>toggleQuest(key,D)]])}
 const idx=+key,sd=SIDE[idx],G=SIDE_GUIDE[sd[0]]||{why:sd[2]||'',when:STAT_WHEN[sd[1]]},d=L.side[idx];
 const h=`<h2>[隨機任務]</h2><div class="bigt" style="font-size:22px">${esc(sd[0])}</div><div class="row" style="gap:8px;margin:0 0 10px">${tag(sd[1])}<span class="muted" style="font:12px var(--mono)">+15 XP</span></div>`+guideHtml(G);
 modal(h,d?[['關閉','btn'],['取消完成','btn red',()=>toggleSide(D,idx)]]:[['關閉','btn'],['完成 ✓','btn pri',()=>toggleSide(D,idx)]])}
function pickLevel(q,t){const was=cleared(t);
 modal(`<h2>[${esc(q.name)}]</h2><div class="bigt" style="font-size:22px">今天做到哪個程度？</div><p class="muted" style="margin:0 0 4px;font-size:12px">迷你也算完成。狀態差就做迷你，別讓它斷掉。</p><div class="lvpick">${q.lv.map((l,i)=>`<button data-pick="${i}" style="border-color:${ELV[i][2]}66"><b style="color:${ELV[i][2]}">${ELV[i][0]}</b><span>${esc(l)}</span><small>+${Math.round(q.xp*ELV[i][1])} XP</small></button>`).join('')}</div>`,[['取消','btn']]);
 $('#mcard').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;$('#modal').classList.remove('on');$('#mcard').onclick=null;doLevel(q,t,+b.dataset.pick)}}
const hintHtml=h=>h?`<p class="muted" style="line-height:1.7;white-space:pre-line;margin:0 0 4px">${esc(h)}</p>`:'';
function toggleQuest(id,t,ok){const q=QUESTS.find(x=>x.id===id);if(!q)return;if(q.type==='screen')return openScreen(id,t);
 if(q.lv&&!dayLog(t).done[id])return pickLevel(q,t);
 const L=dayLog(t),was=cleared(t),tg=Math.max(1,+q.target||1);
 if(L.done[id]){undo(L.done[id]);delete L.done[id];L.cnt[id]=tg>1?tg-1:0}
 else if(tg>1&&(L.cnt[id]||0)+1<tg){L.cnt[id]=(L.cnt[id]||0)+1;sfx('tap')}
 else{L.cnt[id]=tg;L.done[id]=reward(t,id,q.xp,q.stat,'quest')}
 settle(t,was);after()}
function toggleSide(t,idx,ok){const L=dayLog(t),k=String(idx),sd=SIDE[idx];
 if(L.side[k]){undo(L.side[k]);delete L.side[k]}else L.side[k]=reward(t,'side'+idx,15,SIDE[idx][1],'side');after()}

const fmtMin=m=>`${Math.floor(m/60)}h ${pad(m%60)}m`;
function openScreen(id,t,morning,then){const q=QUESTS.find(x=>x.id===id),L=dayLog(t),v=L.scr;
 modal(`<h2>[${morning?'早安・昨日結算':'螢幕時間'}]</h2><div class="bigt">${t===today()?'今天':t.slice(5).replace('-','/')}用了多久？</div>
 <p class="muted" style="line-height:1.6">設定 → 螢幕使用時間 → 查看所有活動，點${t===today()?'今天':'昨天那條'}，看最上面的總時數。目標 ${fmtMin(q.goal)} 以內，越少 XP 越多。</p>
 <div class="row" style="white-space:nowrap"><input id="sh" style="flex:1;min-width:0" type="number" inputmode="numeric" min="0" max="24" placeholder="0" value="${v!=null?Math.floor(v/60):''}"><b>小時</b><input id="sm" style="flex:1;min-width:0" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="${v!=null?v%60:''}"><b>分</b></div>`,
 [['取消','btn',()=>then&&then()],['記錄','btn pri',()=>{if($('#sh').value||$('#sm').value)setScreen(id,t,Math.min(1440,(+$('#sh').value||0)*60+(+$('#sm').value||0)));then&&setTimeout(then,600)}]])}
function setScreen(id,t,m){const q=QUESTS.find(x=>x.id===id),L=dayLog(t),was=cleared(t),g=q.goal;L.scr=m;
 if(L.done[id]){undo(L.done[id]);delete L.done[id]}
 if(m<=g){L.done[id]=reward(t,id,Math.round(q.xp*(1+Math.min(1,(g-m)/g))),q.stat,'quest');if(m<=g/2)setTimeout(()=>toast('<b>[系統]</b> 比目標少一半以上，XP 加成拉滿'),400)}
 else{sfx('bad');toast(`超標 ${m-g} 分鐘，明天再拚`)}
 settle(t,was);after()}
function askScreen(){const t=today(),y=addDays(t,-1);if(S.asked===t||diff(S.start,y)<0)return;const q=QUESTS.find(q=>q.type==='screen'&&activeOn(q,y));
 if(!q||(S.log[y]&&S.log[y].scr!=null))return;S.asked=t;save();setTimeout(()=>openScreen(q.id,y,true),400)}

function openChest(big){const lk=1+.3*skl('luck');
 if(big){const pool=[];for(const k in GEAR)GEAR[k].items.slice(0,2).forEach(it=>{if(!S.gear.own.includes(it[0]))pool.push(it)});
  if(pool.length&&Math.random()<.5){const it=pool[Math.floor(Math.random()*pool.length)];giveGear(it[0]);jlog('🎁',`簽到大寶箱開出「${it[1]}」`);return{ic:'🗡️',txt:`稀有掉落：<b style="color:var(--gold)">${it[1]}</b>`}}
  const g=Math.round((100+Math.floor(Math.random()*81))*lk);S.gold+=g;return{ic:'💰',txt:`<span class="gold">+${g} G</span>`}}
 if(Math.random()<.3){const x=15+Math.floor(Math.random()*11);gain(x,0);return{ic:'✨',txt:`<b style="color:var(--cyan)">+${x} XP</b>`}}
 const g=Math.round((20+Math.floor(Math.random()*26))*lk);S.gold+=g;return{ic:'💰',txt:`<span class="gold">+${g} G</span>`}}
function checkLogin(then){const t=today();if(S.login.last===t)return false;const y=addDays(t,-1);
 S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=t;S.login.best=Math.max(S.login.best||0,S.login.streak);
 const k=(S.login.streak-1)%7,r=LOGIN[k];let res;
 if(r[0]==='g'){const g=Math.round(r[1]*(1+eqv('armor')));S.gold+=g;res={ic:'💰',txt:`<span class="gold">+${g} G</span>`}}else res=openChest(r[0]==='C');
 sfx('chest');checkAch();save();
 const cal=LOGIN.map((x,i)=>`<div class="cd ${i<k?'got':i===k?'now':''}"><small>D${i+1}</small><span>${x[0]==='g'?'💰':x[0]==='c'?'🎁':'👑'}</span><small>${x[0]==='g'?x[1]+'G':x[0]==='c'?'寶箱':'大寶箱'}</small></div>`).join('');
 modal(`<h2>[每日簽到] 連續 ${S.login.streak} 天</h2><div class="cal">${cal}</div><div class="chestbox"><div class="chest">${r[0]==='g'?'💰':'🎁'}</div><div class="reveal"><div style="font-size:44px">${res.ic}</div><div class="bigt" style="font-size:22px">${res.txt}</div></div></div><p class="muted" style="text-align:center;margin:0">斷簽會從第 1 天重來。第 7 天大寶箱有機會開出裝備。</p>`,[['收下','btn pri',()=>{render();then&&then()}]]);
 return true}

function pStats(){const L=lvInfo(S.xp).lv,st=S.stats;
 const hp=Math.round((100+L*5+(st.VIT||0)*1.5)*(1+eqv('armor'))),atk=Math.round((18+L*2.5+(st.STR||0)*.7)*(1+eqv('weapon')));
 return{hp,atk,crit:critRate(),L}}
function weekXP(wk){let x=0;for(let i=0;i<7;i++){const L=S.log[addDays(wk,i)];if(!L)continue;
 for(const k in L.done||{})x+=L.done[k].xp||0;for(const k in L.side||{})x+=L.side[k].xp||0;(L.extra||[]).forEach(e=>x+=e.r?e.r.xp:0);(L.focus||[]).forEach(f=>x+=f.xp||0)}return x}
const chargeOf=wk=>Math.round(weekXP(wk)*.4);
const isFightDay=()=>{const w=parse(today()).getDay();return w===6||w===0};
function bossStats(b){return{hp:b.hp,atk:12+3*b.t}}
function predict(b){const p=pStats(),ch=chargeOf(S.boss.week),est=ch+p.atk*FIGHT_TURNS*(1+p.crit),ratio=est/b.hp;
 return ratio>=1.3?['勝算很高','var(--green)']:ratio>=1?['有機會贏','var(--cyan)']:ratio>=.75?['要靠魔法','var(--gold)']:['很危險','var(--red)']}

  if(a==='bolt'){dmg=30+F.L*2;F.stun=1;F.log.push(`⚡ 雷擊！<b>${dmg}</b> 點傷害，Boss 麻痺了`)}

 h+=`<div class="panel sys"><div class="ptitle">[魔法]<span>決戰時用・每場最多 ${SPELL_MAX} 次</span></div><div class="mats" style="margin:0 0 6px">${Object.entries(MATS).map(([k,v])=>`<div><span>${v[0]}</span><b>${S.mats[k]||0}</b><small>${v[1]}</small></div>`).join('')}</div>`+SPELLS.map(sp=>{const can=!pp&&S.gold>=sp.g&&Object.entries(sp.m).every(([k,n])=>(S.mats[k]||0)>=n);

 h+=`<div class="panel"><div class="ptitle">[技能]<span>每項最高 Lv.3</span></div>`+SKILLS.map(sk=>{const lv=skl(sk[0]);return`<div class="item"><span class="gic">${sk[1]}</span><span class="nm">${sk[2]} <span class="dots">${[1,2,3].map(n=>`<i class="${n<=lv?'on':''}"></i>`).join('')}</span><div class="muted" style="font-size:12px">${lv?sk[3](lv):sk[3](1).replace(/\+\d+%/,m=>m)+'（Lv.1）'}</div></span>${lv>=3?'<span class="chip">MAX</span>':`<button class="btn sm cy" data-skill="${sk[0]}" ${pp||S.gold<SKILL_COST[lv]?'disabled':''}>${SKILL_COST[lv]} G</button>`}</div>`}).join('')+'</div>';
 h+=`<div class="panel"><div class="ptitle">[現實獎勵]<span>先賺到再享受</span></div>`+(REWARDS.length?REWARDS.map(r=>`<div class="item"><span class="nm">${esc(r.name)}${S.gold<r.cost?`<div class="bar gold" style="height:4px;margin-top:5px"><i style="width:${Math.max(0,S.gold)/r.cost*100}%"></i></div>`:''}</span><button class="btn sm cy" data-buy="${r.id}" ${pp||S.gold<r.cost?'disabled':''}>${r.cost} G</button></div>`).join(''):'<p class="muted">去設定新增想要的獎勵。</p>')+'</div>';
 if(S.buys.length)h+=`<div class="panel"><div class="ptitle">[購買紀錄]</div>${S.buys.slice(0,8).map(b=>{const d=new Date(b.t);return`<div class="item"><span class="nm">${esc(b.name)}</span><span class="muted">${d.getMonth()+1}/${d.getDate()}</span><span class="gold" style="min-width:52px;text-align:right">-${b.cost}</span></div>`}).join('')}</div>`;

function gearIcon(k,t){return{weapon:['','🪵','🗡️','⚔️','🔱','☠️'],armor:['','👕','🦺','⛓️','🛡️','🖤'],acc:['','💍','📿','💎','⚡','👑']}[k][t]}

function radar(){const ks=Object.keys(STATS),mx=Math.max(10,...ks.map(k=>S.stats[k]||0)),R=72,cx=110,cy=96;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/ks.length;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let s=`<svg viewBox="0 0 220 190" style="width:100%;max-width:280px;display:block;margin:0 auto">`;
 for(const f of[.33,.66,1])s+=`<polygon points="${ks.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#1c2a44"/>`;
 ks.forEach((k,i)=>{const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1c2a44"/>`;const[lx,ly]=pt(i,R+15);s+=`<text x="${lx}" y="${ly+4}" fill="${STATS[k].c}" font-size="11" text-anchor="middle">${STATS[k].n}</text>`});
 return s+`<polygon points="${ks.map((k,i)=>pt(i,Math.max(4,R*(S.stats[k]||0)/mx)).join(',')).join(' ')}" fill="rgba(79,209,255,.22)" stroke="#4fd1ff" stroke-width="2"/></svg>`}
function realData(){const t=today(),cnt=(ids,a,b)=>{let n=0;for(let i=a;i<b;i++){const L=S.log[addDays(t,-i)];if(L&&L.done)ids.forEach(id=>{n+=am(L,id)})}return n};
 const am=(L,id)=>{const r=L.done[id];return r?(r.amt!=null?r.amt:(QUESTS.find(q=>q.id===id)||{}).per||1):0};
 const tot=ids=>Object.values(S.log).reduce((a,L)=>a+(L.done?ids.reduce((x,id)=>x+am(L,id),0):0),0);
 const groups=[];for(const q of QUESTS){if(q.type==='screen')continue;const key=q.group||q.id,g=groups.find(x=>x.key===key);if(g)g.ids.push(q.id);else groups.push({key,ids:[q.id],name:q.gname||q.name,per:q.per||1,unit:q.unit||'次'})}
 let h=`<div class="panel sys"><div class="ptitle">[現實數據]<span>本週 vs 上週・累計</span></div>`;
 h+=groups.map(g=>{const a=cnt(g.ids,0,7),b=cnt(g.ids,7,14),T=tot(g.ids),d=a-b;return`<div class="rd"><span class="nm">${esc(g.name)}</span><b>${a}</b><span class="dl ${d>0?'up':d<0?'dn':''}">${d>0?'▲'+d:d<0?'▼'+(-d):'—'}</span><span class="muted">累計 ${T} ${g.unit}</span></div>`}).join('');
 const avg=(a,b)=>{const v=[];for(let i=a;i<b;i++){const L=S.log[addDays(t,-i)];if(L&&L.scr!=null)v.push(L.scr)}return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null};
 const s1=avg(0,7),s0=avg(7,14);
 if(s1!=null)h+=`<div class="rd"><span class="nm">螢幕時間（日均）</span><b>${fmtMin(s1)}</b><span class="dl ${s0!=null&&s1<s0?'up':s0!=null&&s1>s0?'dn':''}">${s0==null?'—':s1<s0?'▼'+(s0-s1)+'m':s1>s0?'▲'+(s1-s0)+'m':'—'}</span><span class="muted">${s0!=null?'上週 '+fmtMin(s0):''}</span></div>`;
 h+=`<div class="rd"><span class="nm">隨機任務</span><b>${S.sideCount}</b><span class="dl"></span><span class="muted">累計個</span></div>`;
 return h+`<p class="muted" style="margin:6px 0 0;font-size:12px">▲ 綠色 = 比上週進步（螢幕時間是越少越好）</p></div>`}
function scrChart(){const g=180,t=today(),days=[];for(let i=6;i>=0;i--){const d=addDays(t,-i);days.push([d,S.log[d]&&S.log[d].scr])}
 if(!days.some(x=>x[1]!=null))return'';const mx=Math.max(g*1.3,...days.map(x=>x[1]||0)),H=110,W=300,bw=30;
 let svg=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%">`;days.forEach(([d,v],i)=>{const x=12+i*41;if(v!=null){const hh=v/mx*H;svg+=`<rect x="${x}" y="${H-hh}" width="${bw}" height="${hh}" rx="5" fill="${v<=g?'#4fd1ff':'#ff5d6c'}" opacity=".85"/><text x="${x+bw/2}" y="${H-hh-4}" fill="#e6eefc" font-size="10" text-anchor="middle">${(v/60).toFixed(1)}</text>`}svg+=`<text x="${x+bw/2}" y="${H+16}" fill="#7d8aa6" font-size="11" text-anchor="middle">${WD[parse(d).getDay()]}</text>`});
 const gy=H-g/mx*H;return`<div class="panel"><div class="ptitle">[螢幕時間]<span>近 7 天（小時）</span></div>${svg}<line x1="4" x2="${W-4}" y1="${gy}" y2="${gy}" stroke="#f5c451" stroke-dasharray="4 4"/></svg></div>`.replace('</svg><line','<line')}
function rates(){const t=today();const rows=QUESTS.map(q=>{let a=0,d=0;for(let i=0;i<14;i++){const x=addDays(t,-i);if(diff(S.start,x)<0)break;if(!activeOn(q,x))continue;const ok=S.log[x]&&S.log[x].done&&S.log[x].done[q.id];if(i===0&&!ok)continue;a++;if(ok)d++}return[q,a?d/a:null]}).filter(r=>r[1]!==null);
 if(!rows.length)return'';rows.sort((x,y)=>x[1]-y[1]);
 return`<div class="panel"><div class="ptitle">[任務完成率]<span>近 14 天・弱點在上面</span></div>${rows.map(([q,p])=>`<div class="rate"><span class="nm">${esc(q.name)}</span><div class="bar ${p<.5?'red':''}"><i style="width:${p*100}%"></i></div><span class="muted" style="width:40px;text-align:right">${Math.round(p*100)}%</span></div>`).join('')}</div>`}
function vMe(){const L=lvInfo(S.xp),r=rankOf(L.lv),nx=RANKS.find(x=>x[0]>L.lv);
 let h=`<div class="panel sys" style="text-align:center"><div class="ptitle">[狀態欄]<span>${esc(S.start)} 開始</span></div>
 <div class="avatar">${avatarSvg(320)}</div>
 <div style="font-size:20px;font-weight:800"><span style="color:${AURA[r[1]]}">${r[1]} 級</span>・Lv.${L.lv} ${r[2]}</div>
 <div class="pw">戰力 <b>${power()}</b></div><p class="muted" style="margin:4px 0 10px">${nx?`Lv.${nx[0]} 晉升 ${nx[1]} 級`:'已達最高階級'}</p>
 <div class="eqrow">${['weapon','armor','acc'].map(k=>{const g=eqItem(k);return`<div><span>${g?gearIcon(k,g.tier):'—'}</span><small>${GEAR[k].n}</small><b>${g?g.it[1]:'空'}</b></div>`}).join('')}</div>
 ${radar()}<div class="stats">${Object.keys(STATS).map(k=>`<div><b style="color:${STATS[k].c}">${S.stats[k]||0}</b><span class="muted">${STATS[k].n}</span></div>`).join('')}</div></div>`;
 h+=realData()+scrChart()+rates();
 h+=`<div class="panel"><div class="ptitle">[戰績]</div><div class="stats" style="grid-template-columns:repeat(4,1fr)"><div><b>${S.questCount}</b><span class="muted">任務</span></div><div><b>${S.best||0}</b><span class="muted">最佳連續</span></div><div><b>${S.bossKills}</b><span class="muted">Boss</span></div><div><b>${S.crits}</b><span class="muted">暴擊</span></div></div></div>`;
 h+=`<div class="panel"><div class="ptitle">[成就]<span>${Object.keys(S.ach).length}/${ACH.length}</span></div><div class="ach">${ACH.map(a=>`<div class="${S.ach[a[0]]?'':'off'}"><b>${a[1]}</b>${a[2]}<div class="muted" style="font-size:10px;margin-top:2px">${a[3]}</div></div>`).join('')}</div></div>`;
 return h}

 const D=viewY?addDays(today(),-1):today();
 if(d.spell){const sp=SPELLS.find(x=>x.id===d.spell);if(S.gold<sp.g||!Object.entries(sp.m).every(([k,n])=>(S.mats[k]||0)>=n))return toast('金幣或素材不夠');
  S.gold-=sp.g;Object.entries(sp.m).forEach(([k,n])=>S.mats[k]-=n);S.items[sp.id]=(S.items[sp.id]||0)+1;sfx('chest');toast(`<b>${sp.ic} ${sp.n}</b> 製作完成`);return after()}
 if(d.xdel!==undefined){const L=dayLog(D),e=(L.extra||[])[+d.xdel];if(!e)return;return modal(`<h2>[額外修練]</h2><div class="bigt" style="font-size:22px">刪除「${esc(e.text)}」？</div><p class="muted">加的分會扣回來。</p>`,[['取消','btn'],['刪除','btn red',()=>{if(e.r)undo(e.r);L.extra.splice(+d.xdel,1);after()}]])}
 if(d.mood!==undefined){const m=+d.mood;S.jm=S.jm===m?null:m;document.querySelectorAll('[data-mood]').forEach(b=>b.classList.toggle('on',+b.dataset.mood===S.jm));return}

 if(d.side)return toggleSide(D,+d.side);
 if(d.day){viewY=d.day==='y';return render()}
 if(d.shift!==undefined){if(d.shift==='1')S.shift[D]=1;else delete S.shift[D];return after()}
 if(d.gear)return buyGear(d.gear);
 if(d.eq){const g=gearById(d.eq);S.gear.eq[g.slot]=d.eq;sfx('tap');return after()}
 if(d.skill)return buySkill(d.skill);
 if(d.pen){const p=S.penalties.find(x=>x.id===d.pen);return modal(`<h2>[懲罰任務]</h2><div class="bigt">${esc(p.text)}</div><p class="muted">誠實點，真的做完了？</p>`,[['還沒','btn'],['做完了','btn red',()=>{p.done=true;jlog('✅',`完成懲罰任務：${p.text}`);toast('<b>[系統]</b> 懲罰解除，商店開放');after()}]])}
 if(d.fcat){S.fcat=d.fcat;save();return render()}
 if(d.focus){const fc=S.fcat||'study';S.timer={end:Date.now()+d.focus*6e4,min:+d.focus,cat:fc};save();toast(`<b>[專注討伐]</b> 進入 ${d.focus} 分鐘`);return render()}
 if(d.buy){const r=REWARDS.find(x=>x.id===d.buy);if(!r)return;if(pendingPen().length)return toast('先完成懲罰任務');if(S.gold<r.cost)return toast('金幣不夠');
  return modal(`<h2>[確認購買]</h2><div class="bigt">${esc(r.name)}</div><p>花費 <span class="gold">${r.cost} G</span>，剩 <span class="gold">${S.gold-r.cost} G</span></p>`,[['算了','btn'],['買','btn pri',()=>{S.gold-=r.cost;S.buys.unshift({t:Date.now(),name:r.name,cost:r.cost});jlog('🎉',`花 ${r.cost} G 兌換了「${r.name}」`);S.buys=S.buys.slice(0,50);after();sfx('lv');toast(`<b>已購買</b>　${esc(r.name)}，去享受吧`)}]])}
 switch(el.id){
  case'toClaude':{const tx=exportForClaude();const done=()=>modal('<h2>[已複製]</h2><div class="bigt" style="font-size:22px">貼給 Claude 吧</div><p class="muted" style="line-height:1.7">打開 Claude，貼上剛剛複製的內容送出，就會幫你分析最近的狀況。<br>紀錄只會在你貼上時傳出去，app 本身不會上傳任何資料。</p>',[['好','btn pri']]);
   const fb=()=>modal(`<h2>[手動複製]</h2><p class="muted">長按下面的文字 → 全選 → 拷貝</p><textarea style="min-height:220px;font-size:12px">${esc(tx)}</textarea>`,[['關閉','btn']]);
   try{navigator.clipboard.writeText(tx).then(done,fb)}catch(e){fb()}return}
  case'xJudge':return openExtra(D,($('#xtxt').value||'').trim());
  case'jSave':{const tx=($('#jtxt').value||'').trim();if(!tx)return toast('先寫點什麼');S.journal=S.journal||[];S.journal.unshift({t:Date.now(),d:today(),type:'user',text:tx.slice(0,2000),mood:S.jm==null?null:S.jm});
   jDraft='';S.jm=null;if(S.jxp!==today()){S.jxp=today();S.stats.SPI=(S.stats.SPI||0)+1;gain(10,0);toast('<b>[勇者日誌]</b> 今天第一篇 +10 XP　心靈 +1')}else toast('<b>已寫入日誌</b>');sfx('done');return after()}
  case'fight':return startFight();
  case'giveup':return modal('<h2>[專注討伐]</h2><div class="bigt">確定逃跑？</div><p class="muted">不會有任何獎勵。</p>',[['繼續撐','btn pri'],['逃跑','btn red',()=>{S.timer=null;save();render()}]]);
  case'tHard':S.hard=!S.hard;if(S.hard)S.lastClosed=addDays(today(),-1);return after();
  case'tSnd':S.sound=!S.sound;save();sfx('done');return render();
  case'tBadge':{if(!('setAppBadge'in navigator)){toast('這裡不支援，先「加入主畫面」再從主畫面打開');return}
   const on=()=>{S.badge=true;save();updBadge();render();toast('<b>已開啟</b>')};
   if(S.badge){S.badge=false;try{navigator.clearAppBadge()}catch(e){}save();return render()}
   try{if(window.Notification&&Notification.permission!=='granted')Notification.requestPermission().then(p=>p==='granted'?on():toast('要允許通知才能顯示數字'));else on()}catch(e){on()}return}
  case'cpUrl':{const u=location.href.split('#')[0];try{navigator.clipboard.writeText(u).then(()=>toast('<b>已複製</b>　'+esc(u)),()=>toast(esc(u)))}catch(e){toast(esc(u))}return}
  case'bkFile':return backupFile();
  case'rsFile':return $('#rsInput').click();
  case'exp':{S.lastBackup=Date.now();save();const t=$('#bk');t.classList.remove('hide');$('#impGo').classList.add('hide');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('<b>已複製</b>　貼到備忘錄存起來'),()=>toast('請手動複製下面的文字'))}catch(err){toast('請手動複製下面的文字')}return}
  case'imp':{const t=$('#bk');t.classList.remove('hide');t.value='';t.placeholder='把備份文字貼在這';$('#impGo').classList.remove('hide');return}
  case'impGo':try{const o=JSON.parse($('#bk').value);if(!o.log)throw 0;return restoreData(o);localStorage.setItem(KEY,JSON.stringify(o));load();save();toast('<b>匯入成功</b>');render()}catch(err){toast('格式不對，確認有整段貼上')}return;
  case'restart':return modal('<h2>[重開計畫]</h2><div class="bigt">從 DAY 1 重新開始？</div><p class="muted">等級、金幣、裝備、成就保留，66 天進度歸零。</p>',[['取消','btn'],['重開','btn pri',()=>{S.start=today();S.lastClosed=null;S.penalties=[];save();render()}]]);
  case'wipe':return modal('<h2>[警告]</h2><div class="bigt" style="color:var(--red)">全部清空？</div><p class="muted">無法復原。建議先匯出備份。</p>',[['取消','btn'],['清空','btn red',()=>{S=defaults();S.seen=1;save();render()}]]);
 }});
$('#view').addEventListener('keydown',e=>{if(e.target.id==='xtxt'&&e.key==='Enter'){e.preventDefault();openExtra(viewY?addDays(today(),-1):today(),(e.target.value||'').trim())}});
$('#view').addEventListener('change',e=>{if(e.target.id==='rsInput'){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.log)throw 0;restoreData(o)}catch(err){toast('這個檔案不是 RESET 的備份')}};rd.readAsText(f);e.target.value='';return}
 if(e.target.id==='dayStart'){S.dayStart=+e.target.value;save();return render()}
});

/* ---------- 計時 ---------- */
function tick(){const tm=S.timer;if(!tm)return;const left=tm.end-Date.now();
 if(left<=0){S.timer=null;const t=today(),fc=FCATS[tm.cat||'study'],L0=dayLog(t),combo=1+Math.min(3,L0.focus.length)*.2;
  const r=reward(t,'focus'+Date.now(),Math.round(tm.min*.8),fc[2],'focus');S.focusCount++;L0.focus.push({min:tm.min,xp:r.xp,cat:tm.cat});
  const m=minionOf(dun().floor),weak=m.w===fc[2],hit=Math.round(tm.min*3*combo);hitMinion(hit,'focus',fc[2]);jlog('⚔️',`專注討伐：${fc[1]} ${tm.min} 分鐘`);after();
  modal(`<h2>[專注討伐] 完成</h2><div style="text-align:center">${minionSvg(dun().floor,140)}</div><div class="bigt" style="text-align:center">${fc[0]} ${fc[1]} ${tm.min} 分鐘</div><p style="text-align:center;line-height:1.8"><b style="color:var(--cyan)">+${r.xp} XP</b>　<span class="gold">+${r.gold} G</span>　${STATS[fc[2]].n} +1<br>重擊 <b>${hit*(weak?2:1)}</b>${weak?'（弱點 ×2）':''}${combo>1?`・連戰 ×${combo.toFixed(1)}`:''}</p>`,[['讚','btn pri']]);return}
 const el=$('#tmr');if(el){const s=Math.ceil(left/1e3);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}}
setInterval(tick,1000);
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();closeDays();render();checkLogin(askScreen)}},30000);
document.addEventListener('visibilitychange',()=>{try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update())}catch(e){}if(!document.hidden&&S.seen){closeDays();bossInfo();render();if(!$('#modal').classList.contains('on'))boot()}});

/* ---------- 啟動 ---------- */
if(!S.journal){S.journal=[];jlog('🌅','冒險開始。66 天後，成為更好的自己。')}
if(S.bossKills===undefined)S.bossKills=0;S.chap=S.chap||{};if(S.boss.week&&!S.chap[S.boss.week]&&S.boss.idx!==undefined)S.chap[S.boss.week]=BOSS[S.boss.idx].n;
dun();closeDays();bossInfo();checkAch();save();render();updBadge();
try{if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
function boot(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(S.pendingMsg){const h=S.pendingMsg;S.pendingMsg=null;save();sfx('bad');modal(h,[['可惡','btn red',()=>{if(!checkLogin(askScreen))askScreen()}]]);return}
 if(!checkLogin(()=>{askScreen()}))askScreen();setTimeout(()=>{if(!$('#modal').classList.contains('on'))askBackup()},1500)}
if(!S.seen)modal(`<h2>[系統] 玩家覺醒</h2><div style="text-align:center">${avatarSvg(220)}</div><div class="bigt" style="text-align:center">歡迎來到 RESET</div><p class="muted" style="line-height:1.7">每天完成 75% 任務 = 通關，錯過一天不會斷，連續兩天才會。<br>有些任務分迷你／標準／精英，狀態差做迷你也算。<br>任務 → XP 升級、金幣買裝備和技能；你練什麼，房間和角色就長成什麼樣。<br>平日打地城小怪收集素材、做魔法；週六日跟 Boss 決戰，打贏換更強的，打輸會被搶東西。<br>有上班的日子記得切「有班」。</p>`,[['開始','btn pri',()=>{S.seen=1;save();boot()}]]);
else boot();

</script>
</body>
</html>
