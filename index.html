<title>RESET 系統</title>
<style>
:root{--bg:#05070d;--panel:#0b1120;--panel2:#0f1830;--line:#1c2a44;--cyan:#4fd1ff;--blue:#3b82f6;--gold:#f5c451;--red:#ff5d6c;--green:#3ee08f;--purple:#b48cff;--text:#e6eefc;--mute:#7d8aa6;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 72px);min-height:100vh;
 background:radial-gradient(ellipse at 50% -10%,rgba(59,130,246,.18),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#070c18;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
a{color:var(--cyan)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;gap:12px;padding:12px 14px 6px;max-width:560px;margin:0 auto}
.rank{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 22px var(--mono);
 border:1.5px solid var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(79,209,255,.35),inset 0 0 10px rgba(79,209,255,.15)}
.who{flex:1;min-width:0}
.who .l1{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.who .l1 b{color:var(--text);font-size:15px}
.bar{height:8px;background:#0a1222;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .5s}
.bar.red>i{background:linear-gradient(90deg,#b3263a,var(--red));box-shadow:0 0 10px var(--red)}
.bar.gold>i{background:linear-gradient(90deg,#c58b1a,var(--gold));box-shadow:none}
.gold{color:var(--gold);font-weight:700;font-family:var(--mono)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;position:relative}
.sys{border-color:rgba(79,209,255,.45);box-shadow:0 0 0 1px rgba(79,209,255,.08),0 0 24px rgba(79,209,255,.08)}
.ptitle{font:700 13px var(--mono);color:var(--cyan);letter-spacing:.06em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.ptitle span{color:var(--mute);font-weight:500}
.day{display:flex;align-items:flex-end;gap:14px}
.day .big{font:800 40px/1 var(--mono);letter-spacing:-1px}
.day .big small{font-size:16px;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:#070c18}
.chip.hot{color:#ffb35c;border-color:#5a3a18}
.q{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;border:1px solid transparent;width:100%;text-align:left;transition:.15s}
.q+.q,.qr+.qr{border-top:1px solid var(--line)}
.qr .q{border-radius:0}
.q .box{width:24px;height:24px;border-radius:7px;border:1.5px solid #34466b;flex:none;display:grid;place-items:center;font-size:14px}
.q.done .box{background:var(--cyan);border-color:var(--cyan);color:#001018;box-shadow:0 0 10px var(--cyan)}
.q .nm{flex:1}
.q.done .nm{color:var(--mute)}
.q.done .qn{text-decoration:line-through}
.tag{font:600 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid}
.xp{font:600 12px var(--mono);color:var(--mute);min-width:44px;text-align:right}
.q:active{transform:scale(.98)}
.cntw{display:flex;align-items:center;gap:8px;margin-top:5px}.cntw b{font:600 12px var(--mono);color:var(--cyan)}.q.done .cntw{text-decoration:none}
.cnt{flex:1;height:4px;background:#0a1222;border-radius:99px;overflow:hidden}.cnt i{display:block;height:100%;background:var(--cyan)}
.minus{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:20px;color:var(--mute);flex:none}
.row>.q{flex:1}
.slot{font-size:12px;color:var(--mute);margin:10px 0 2px;letter-spacing:.05em}
.slot:first-of-type{margin-top:2px}
.chipg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chipg button{padding:8px 11px;border-radius:99px;border:1px solid var(--line);font-size:14px}.chipg button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(79,209,255,.12)}
.bonus{border-color:rgba(245,196,81,.45)}
.wd{display:flex;gap:4px;margin:0 0 12px}.wd button{flex:1;padding:5px 0;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--mute)}.wd button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(79,209,255,.1)}
.rate{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}.rate .nm{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rate .bar{flex:1;margin:0}
.pen{border-color:rgba(255,93,108,.5)}
.pen .ptitle{color:var(--red)}
.heat{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:#0a1222;border:1px solid #121d33}
.heat i.ok{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px rgba(79,209,255,.5)}
.heat i.part{background:#1d4a6b}
.heat i.miss{background:#3a1520;border-color:#552030}
.heat i.now{outline:2px solid var(--gold);outline-offset:1px}
.boss{text-align:center}
.boss .em{font-size:64px;line-height:1.1;filter:drop-shadow(0 0 16px rgba(255,93,108,.5))}
.boss.dead .em{filter:grayscale(1) opacity(.5)}
.boss h3{margin:6px 0 2px;font-size:20px}
.muted{color:var(--mute);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:#0c1528}
.btn.pri{background:linear-gradient(180deg,#2d7cf6,#1f5fd0);border-color:#4d8ff8;box-shadow:0 0 16px rgba(59,130,246,.35)}
.btn.cy{background:rgba(79,209,255,.12);border-color:var(--cyan);color:var(--cyan)}
.btn.red{background:rgba(255,93,108,.12);border-color:var(--red);color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.timer{font:800 56px/1 var(--mono);text-align:center;margin:10px 0;letter-spacing:2px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{flex:1}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;background:#070c18}
.ach div b{display:block;font-size:24px;margin-bottom:4px}
.ach div.off{opacity:.3;filter:grayscale(1)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin-top:6px}
.stats b{display:block;font:800 20px var(--mono)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(5,7,13,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
 display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--cyan)}
nav button.on i{filter:drop-shadow(0 0 6px var(--cyan))}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:rgba(8,14,28,.96);border:1px solid var(--cyan);color:var(--text);padding:9px 14px;border-radius:12px;font-size:14px;box-shadow:0 0 20px rgba(79,209,255,.3);
 animation:tin .25s ease-out;max-width:90vw}
.toast b{color:var(--cyan);font-family:var(--mono)}
.toast.crit{border-color:var(--gold);box-shadow:0 0 20px rgba(245,196,81,.35)}
.toast.crit b{color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.on{display:flex}
#modal .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--cyan);border-radius:18px;padding:20px;box-shadow:0 0 40px rgba(79,209,255,.25);animation:pop .25s}
#modal .card h2{font:700 13px var(--mono);color:var(--cyan);margin:0 0 10px;letter-spacing:.08em}
#modal .card .bigt{font-size:26px;font-weight:800;margin:4px 0 8px}
#modal .acts{display:flex;gap:8px;margin-top:16px}
#modal .acts>*{flex:1;text-decoration:none;color:inherit}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.edit{display:grid;grid-template-columns:1fr 84px 64px 34px;gap:6px;margin-bottom:6px}
.edit.rw{grid-template-columns:1fr 80px 34px}
.edit3{display:flex;gap:6px;margin:0 0 14px;align-items:center}.edit3 select,.edit3 input{padding:5px 6px;font-size:13px}
.edit button{color:var(--red);font-size:18px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tog{width:50px;height:30px;border-radius:99px;background:#1a2440;position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--red)}
.tog.on.c{background:var(--cyan)}
.tog.on::after{left:23px}
textarea{min-height:90px;font:12px var(--mono)}
.hide{display:none!important}
.quote{font:13px var(--mono);color:var(--mute);text-align:center;margin:4px 0 0}
</style>

<body>
<header class="top">
 <div class="rank" id="hRank">E</div>
 <div class="who">
  <div class="l1"><span><b id="hLv">Lv.1</b> · <span id="hTitle">見習者</span></span><span class="gold" id="hGold">0 G</span></div>
  <div class="bar"><i id="hBar" style="width:0"></i></div>
 </div>
</header>
<main class="wrap" id="view"></main>
<nav id="nav">
 <button data-t="today" class="on"><i>⚔︎</i>任務</button>
 <button data-t="battle"><i>☠︎</i>戰鬥</button>
 <button data-t="shop"><i>⛁</i>商店</button>
 <button data-t="me"><i>◈</i>角色</button>
 <button data-t="set"><i>⚙︎</i>設定</button>
</nav>
<div id="toasts"></div>
<div id="modal"><div class="card" id="mcard"></div></div>

<script>
'use strict';
const KEY='reset_sys_v1';
const STATS={STR:{n:'力量',c:'#ff6b6b'},VIT:{n:'體力',c:'#3ee08f'},INT:{n:'智力',c:'#4fd1ff'},DIS:{n:'紀律',c:'#b48cff'},CHA:{n:'魅力',c:'#f5c451'}};
const RANKS=[[1,'E','見習者'],[5,'D','覺醒者'],[10,'C','獵人'],[20,'B','精英獵人'],[35,'A','王牌'],[50,'S','君主']];
const BOSSES=[['怠惰之王','🦥'],['無限滑動蛇','🐍'],['拖延巨獸','🦣'],['宵夜惡龍','🐉'],['熬夜幽靈','👻'],['藉口魔像','🗿'],['沙發吸血鬼','🧛']];
const PENALTY=['伏地挺身 100 下','深蹲 100 下','棒式累計 5 分鐘','跑步 3 公里','波比跳 50 下','冷水澡 3 分鐘'];
const QUOTES=['今天比昨天強一點就好。','不想做的那一項，通常就是最該做的。','連續比完美重要。','滑手機不會讓你升級。','先做 2 分鐘，剩下的自己會跟上。','系統不會替你出拳。'];

const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date(Date.now()-((S&&S.dayStart)||0)*36e5));
const WD='日一二三四五六';
function srand(str){let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return((h>>>0)%100000)/100000}
const BONUS=[['走 8000 步','VIT'],['整理房間 10 分鐘','DIS'],['寫下 3 件感謝的事','CHA'],['打給家人或朋友','CHA'],['做一件拖很久的小事','DIS'],['不喝含糖飲料','VIT'],['12 點前上床','VIT'],['學一個新東西並教別人','INT'],['伸展 10 分鐘','STR'],['今天不碰短影音','DIS']];
let AC=null;
function sfx(type){if(!S||!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={tap:[[660,.06]],done:[[660,.07],[990,.1]],crit:[[880,.06],[1320,.06],[1760,.14]],lv:[[523,.1],[659,.1],[784,.1],[1047,.25]],bad:[[220,.2],[160,.3]]}[type]||[[660,.06]];let t=AC.currentTime;
 for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9}}catch(e){}}
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const weekKey=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

function defaults(){return{v:3,start:today(),hard:false,sound:true,badge:false,dayStart:4,gold:0,xp:0,best:0,
 quests:[
  {id:uid(),name:'早起（7:30 前）',stat:'DIS',xp:20,slot:'am'},
  {id:uid(),name:'冷水澡',stat:'VIT',xp:10,slot:'am'},
  {id:uid(),name:'喝水（每杯 250ml）',stat:'VIT',xp:10,target:8,slot:'day'},
  {id:uid(),name:'訓練 / 運動',stat:'STR',xp:30,days:[1,2,3,4,5,6],slot:'day'},
  {id:uid(),name:'學語言 15 分鐘',stat:'INT',xp:20,slot:'day'},
  {id:uid(),name:'主動找朋友聊天',stat:'CHA',xp:10,slot:'day'},
  {id:uid(),name:'閱讀 20 分鐘',stat:'INT',xp:20,slot:'pm'},
  {id:uid(),name:'螢幕時間',stat:'DIS',xp:20,type:'screen',goal:180,slot:'pm'}],
 rewards:[
  {id:uid(),name:'追劇一集',cost:50},
  {id:uid(),name:'手搖飲一杯',cost:80},
  {id:uid(),name:'睡到自然醒',cost:120},
  {id:uid(),name:'放縱餐',cost:200},
  {id:uid(),name:'買一個想要的小東西',cost:400}],
 log:{},lastClosed:null,penalties:[],stats:{STR:0,VIT:0,INT:0,DIS:0,CHA:0},
 boss:{week:null,dmg:0,dead:false},bossKills:0,crits:0,focusCount:0,questCount:0,
 ach:{},buys:[],timer:null}}

let S;
function load(){let d=defaults(),r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 S=r&&r.quests?Object.assign(d,r):d;if(S.dayStart===undefined)S.dayStart=4;if(S.sound===undefined)S.sound=true;
 S.rewards=S.rewards.filter(r=>!(r.ig>0));for(const q of S.quests){if(!q.slot)q.slot='day';if(!q.type&&/螢幕時間/.test(q.name)){q.type='screen';q.goal=q.goal||180;q.name='螢幕時間'}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- 核心規則 ---------- */
const dayLog=d=>{const L=S.log[d]||(S.log[d]={done:{},focus:[]});L.cnt=L.cnt||{};return L};
const activeOn=(q,d)=>!q.days||!q.days.length||q.days.includes(parse(d).getDay());
const actives=d=>S.quests.filter(q=>activeOn(q,d));
const need=(d=today())=>Math.ceil(actives(d).length*0.8);
const doneCount=d=>S.log[d]?Object.keys(S.log[d].done).filter(id=>S.quests.some(q=>q.id===id)).length:0;
const cleared=d=>doneCount(d)>=need(d);
const bonusOf=d=>BONUS[Math.floor(srand(d+'bonus')*BONUS.length)];
function streak(){let n=0,d=today();if(cleared(d))n++;d=addDays(d,-1);
 while(diff(S.start,d)>=0&&cleared(d)){n++;d=addDays(d,-1)}return n}
function lvInfo(xp){let lv=1,nd=60;xp=Math.max(0,xp);while(xp>=nd){xp-=nd;lv++;nd=60+lv*25}return{lv,cur:xp,need:nd}}
function rankOf(lv){let r=RANKS[0];for(const x of RANKS)if(lv>=x[0])r=x;return r}
const pendingPen=()=>S.penalties.filter(p=>!p.done);

function closeDays(){const t=today();let d=S.lastClosed?addDays(S.lastClosed,1):S.start;let n=0;
 while(diff(d,t)>1&&n<500){
  if(!cleared(d)&&S.hard&&pendingPen().length<3){
   S.gold=Math.max(0,S.gold-50);sfx('bad');
   S.penalties.push({id:uid(),date:d,text:PENALTY[Math.floor(Math.random()*PENALTY.length)],done:false});
   const md=d.slice(5).replace('-','/');
   setTimeout(()=>modal(`<h2>[系統警告]</h2><div class="bigt" style="color:var(--red)">${md} 任務失敗</div><p class="muted">補登期限過了。硬核模式：扣 50G，並追加懲罰任務。完成前商店鎖定。</p>`,[['收到','btn red']]),400);
  }
  S.lastClosed=d;d=addDays(d,1);n++}
 save()}

function bossInfo(){const wk=weekKey(today());
 if(S.boss.week!==wk)S.boss={week:wk,dmg:0,dead:false};
 const i=Math.floor(parse(wk).getTime()/6048e5)%BOSSES.length;
 const per=S.quests.reduce((a,q)=>a+Number(q.xp||0),0);
 const hp=Math.max(200,Math.round(per*7*0.7));
 return{name:BOSSES[i][0],em:BOSSES[i][1],hp,dmg:Math.min(S.boss.dmg,hp),dead:S.boss.dead}}
function hitBoss(x){bossInfo();if(S.boss.dead)return;S.boss.dmg=Math.max(0,S.boss.dmg+x);const b=bossInfo();
 if(S.boss.dmg>=b.hp){S.boss.dead=true;S.gold+=200;S.xp+=100;S.bossKills++;
  setTimeout(()=>modal(`<h2>[BOSS 擊破]</h2><div style="font-size:56px;text-align:center">${b.em}</div><div class="bigt" style="text-align:center">${b.name} 倒下了</div><p class="muted" style="text-align:center">獎勵 <span class="gold">+200 G</span>　<b style="color:var(--cyan)">+100 XP</b></p>`,[['讚','btn pri']]),300)}}

function gain(xp,gold){const before=lvInfo(S.xp).lv;S.xp+=xp;S.gold+=gold;const after=lvInfo(S.xp).lv;
 if(after>before){sfx('lv');const r0=rankOf(before),r1=rankOf(after);
  setTimeout(()=>modal(`<h2>[系統] LEVEL UP</h2><div class="bigt">Lv.${before} → <span style="color:var(--cyan)">Lv.${after}</span></div>${r1[1]!==r0[1]?`<p>階級提升：<b style="color:var(--gold)">${r1[1]} 級・${r1[2]}</b></p>`:''}<p class="muted">所有屬性的努力都算數。</p>`,[['繼續','btn pri']]),250)}}

// 獎勵結果由「日期+任務」決定：取消再勾不會重抽暴擊
function roll(t,key,base){const crit=srand(t+key+'c')<.15,xp=crit?base*2:base,loot=srand(t+key+'l')<.1?10+Math.floor(srand(t+key+'a')*31):0;return{xp,crit,loot,gold:Math.round(base/2)+loot}}
function undo(r){S.xp-=r.xp;S.gold-=r.gold;S.stats[r.stat]=Math.max(0,(S.stats[r.stat]||0)-1);S.questCount--;if(r.crit)S.crits--;
 bossInfo();if(!S.boss.dead)S.boss.dmg=Math.max(0,S.boss.dmg-r.xp)}
function reward(t,key,base,stat){const r=roll(t,key,base);r.stat=stat;if(r.crit)S.crits++;S.stats[stat]=(S.stats[stat]||0)+1;S.questCount++;gain(r.xp,r.gold);hitBoss(r.xp);
 if(r.crit){sfx('crit');toast(`<b>CRITICAL!</b> 經驗值 ×2　+${r.xp} XP`,'crit')}else{sfx('done');toast(`<b>+${r.xp} XP</b>　+${r.gold-r.loot} G　${STATS[stat].n} +1`)}
 if(r.loot)toast(`<b>寶箱掉落！</b> +${r.loot} G`,'crit');return r}
function settle(t,was){const y=addDays(today(),-1);
 if(!was&&cleared(t)){if(t===today())setTimeout(()=>toast(`<b>[系統]</b> 今日任務達成，連續 ${streak()} 天 🔥`),500);
  else{const p=S.penalties.find(x=>!x.done&&x.date===t);if(p&&t===y){S.penalties=S.penalties.filter(x=>x!==p);S.gold+=50;setTimeout(()=>toast('<b>[系統]</b> 補登成功，懲罰撤銷、退回 50G'),500)}
   else setTimeout(()=>toast(`<b>[系統]</b> ${t.slice(5).replace('-','/')} 補登通關`),500)}}}
const fmtMin=m=>`${Math.floor(m/60)}h ${pad(m%60)}m`;
function openScreen(id,t,morning){const q=S.quests.find(x=>x.id===id),L=dayLog(t),v=L.scr;
 modal(`<h2>[${morning?'早安・昨日結算':'螢幕時間'}]</h2><div class="bigt">${t===today()?'今天':t.slice(5).replace('-','/')}用了多久？</div>
 <p class="muted" style="line-height:1.6">iPhone 設定 → 螢幕使用時間 → 查看所有活動，點${t===today()?'今天':'昨天那條'}，看最上面的總時數。目標 ${fmtMin(q.goal||180)} 以內。</p>
 <div class="row" style="white-space:nowrap"><input id="sh" style="flex:1;min-width:0" type="number" inputmode="numeric" min="0" max="24" placeholder="0" value="${v!=null?Math.floor(v/60):''}"><b>小時</b><input id="sm" style="flex:1;min-width:0" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="${v!=null?v%60:''}"><b>分</b></div>`,

function setScreen(id,t,m){const q=S.quests.find(x=>x.id===id),L=dayLog(t),was=cleared(t),g=q.goal||180;L.scr=m;
 if(L.done[id]){undo(L.done[id]);delete L.done[id]}
 if(m<=g){const base=Math.round(q.xp*(1+Math.min(1,(g-m)/g)));L.done[id]=reward(t,id,base,q.stat);if(m<=g/2)setTimeout(()=>toast('<b>[系統]</b> 比目標少一半以上，XP 加成拉滿'),400)}
 else{sfx('bad');toast(`超標 ${m-g} 分鐘，明天再拚`)}
 settle(t,was);after()}
function askScreen(){const t=today(),y=addDays(t,-1);if(S.asked===t||diff(S.start,y)<0)return;const q=S.quests.find(q=>q.type==='screen'&&activeOn(q,y));
 if(!q){return}if(S.log[y]&&S.log[y].scr!=null)return;S.asked=t;save();setTimeout(()=>openScreen(q.id,y,true),500)}
function toggleQuest(id,t){const q=S.quests.find(x=>x.id===id);if(!q)return;if(q.type==='screen')return openScreen(id,t);const L=dayLog(t),was=cleared(t),tg=Math.max(1,+q.target||1);
 if(L.done[id]){undo(L.done[id]);delete L.done[id];L.cnt[id]=tg>1?tg-1:0}
 else if(tg>1&&(L.cnt[id]||0)+1<tg){L.cnt[id]=(L.cnt[id]||0)+1;sfx('tap')}
 else{L.cnt[id]=tg;L.done[id]=reward(t,id,Number(q.xp),q.stat)}
 settle(t,was);after()}
function minusQuest(id,t){const L=dayLog(t);if(L.done[id]){toggleQuest(id,t);return}if(L.cnt[id]>0){L.cnt[id]--;after()}}
function toggleBonus(t){const L=dayLog(t),b=bonusOf(t);
 if(L.bonus){undo(L.bonus);L.bonus=null}else L.bonus=reward(t,'bonus',30,b[1]);after()}

 for(const f of[.33,.66,1])s+=`<polygon points="${ks.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#1c2a44"/>`;
 ks.forEach((k,i)=>{const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1c2a44"/>`;const[lx,ly]=pt(i,R+14);s+=`<text x="${lx}" y="${ly+4}" fill="${STATS[k].c}" font-size="11" text-anchor="middle">${STATS[k].n}</text>`});

 h+=S.quests.map(q=>`<div class="edit" data-eq="${q.id}"><input value="${esc(q.name)}" data-f="name"><select data-f="stat">${so(q.stat)}</select><select data-f="xp">${[10,20,30,50].map(x=>`<option ${+q.xp===x?'selected':''}>${x}</option>`).join('')}</select><button data-delq="${q.id}">✕</button></div>
  <div class="wd">${[1,2,3,4,5,6,0].map(w=>`<button class="${activeOn(q,fmt(new Date(2024,0,7+w)))?'on':''}" data-wd="${w}" data-wdq="${q.id}">${WD[w]}</button>`).join('')}</div><div class="edit3" data-eq="${q.id}"><select data-f="slot" style="width:auto">${Object.entries({am:'☀️ 早上',day:'🏙 白天',pm:'🌙 晚上'}).map(([k,v])=>`<option value="${k}" ${(q.slot||'day')===k?'selected':''}>${v}</option>`).join('')}</select><select data-f="type" style="width:auto"><option value="">一般</option><option value="screen" ${q.type==='screen'?'selected':''}>螢幕時間</option></select>
  ${q.type==='screen'?`<span class="muted">目標</span><select data-f="goal" style="width:auto">${[60,90,120,150,180,240,300].map(m=>`<option value="${m}" ${(q.goal||180)===m?'selected':''}>${m/60} 小時</option>`).join('')}</select>`:`<span class="muted">次數</span><input type="number" inputmode="numeric" min="1" value="${q.target||1}" data-f="target" style="width:56px">`}</div>`).join('');
 h+=`<button class="btn sm cy" id="addq" style="margin-top:4px">＋ 新增任務</button><p class="muted">藍色 = 那天要做。沒排的日子不算失敗。次數 > 1 會變成計數任務。螢幕時間任務越低 XP 越多。當天完成 80% 算通關，隔天還能補登。</p><button class="btn sm" id="wiz" style="width:100%;margin-top:4px">🎲 重新挑任務組合</button></div>`;
 h+=`<div class="panel"><div class="ptitle">[獎勵編輯]<span>名稱 / 價格</span></div>`;
 h+=S.rewards.map(r=>`<div class="edit rw" data-er="${r.id}"><input value="${esc(r.name)}" data-f="name"><input type="number" inputmode="numeric" value="${r.cost}" data-f="cost"><button data-delr="${r.id}">✕</button></div>`).join('');
 h+=`<button class="btn sm cy" id="addr" style="margin-top:4px">＋ 新增獎勵</button><p class="muted">放你真的想要的東西，越具體越有動力。</p></div>`;
 h+=`<div class="panel"><div class="ptitle">[模式]</div>
 <div class="sw"><div><b>😈 硬核模式</b><div class="muted">沒通關的日子扣 50G＋懲罰任務，做完才能用商店</div></div><button class="tog ${S.hard?'on':''}" id="tHard"></button></div>
 <div class="sw"><div><b>🔊 音效</b><div class="muted">iPhone 開靜音就不會響</div></div><button class="tog c ${S.sound?'on':''}" id="tSnd"></button></div>
 <div class="sw"><div><b>🌙 一天從幾點開始</b><div class="muted">上晚班的話，凌晨 2 點勾的任務還算前一天</div></div><select id="dayStart" style="width:90px">${[0,2,3,4,5,6].map(x=>`<option value="${x}" ${S.dayStart===x?'selected':''}>${pad(x)}:00</option>`).join('')}</select></div>
 <div class="sw"><div><b>🔴 圖示顯示剩幾項</b><div class="muted">主畫面 app 圖示上的紅色數字＝今天還沒做的任務（要先加到主畫面）</div></div><button class="tog c ${S.badge?'on':''}" id="tBadge"></button></div></div>
 <div class="panel"><div class="ptitle">[每日提醒]<span>用 iPhone 捷徑，免費</span></div>
 <p class="muted" style="line-height:1.7;margin:0">捷徑 app → 自動化 → ＋ → 特定時間（例如 22:00）→ 選「立即執行」→ 動作選「打開 URL」→ 貼上這個 app 的網址。時間到 RESET 會自己跳出來。早上再設一個，效果更好。</p>
 <button class="btn sm cy" id="cpUrl" style="width:100%;margin-top:10px">複製這個 app 的網址</button></div>`;
 h+=`<div class="panel"><div class="ptitle">[備份]<span>換手機前一定要做</span></div>
 <div class="row"><button class="btn sm cy grow" id="exp">匯出（複製）</button><button class="btn sm grow" id="imp">匯入</button></div>
 <textarea id="bk" class="hide" style="margin-top:8px"></textarea><button class="btn sm pri hide" id="impGo" style="margin-top:6px;width:100%">確認匯入</button></div>
 <div class="panel"><div class="ptitle" style="color:var(--red)">[危險區]</div><div class="row"><button class="btn sm grow" id="restart">重開 66 天（保留等級）</button><button class="btn sm red grow" id="wipe">全部清空</button></div></div>`;
 return h}

const GOALS=[
 ['💪','體能',[['訓練 / 運動','STR',30,{days:[1,2,3,4,5,6],slot:'day'}],['伸展 10 分鐘','STR',10,{slot:'pm'}]]],
 ['⏰','作息',[['早起（7:30 前）','DIS',20,{slot:'am'}],['12 點前上床','VIT',20,{slot:'pm'}]]],
 ['💧','健康',[['喝水（每杯 250ml）','VIT',10,{target:8,slot:'day'}],['冷水澡','VIT',10,{slot:'am'}]]],
 ['📚','學習',[['閱讀 20 分鐘','INT',20,{slot:'pm'}],['學語言 15 分鐘','INT',20,{slot:'day'}]]],
 ['📵','少滑手機',[['螢幕時間','DIS',20,{type:'screen',goal:180,slot:'pm'}],['睡前 30 分鐘不碰手機','DIS',20,{slot:'pm'}]]],
 ['🤝','社交',[['主動找朋友聊天','CHA',10,{slot:'day'}],['認真回覆訊息','CHA',10,{slot:'day'}]]],
 ['🧘','心靈',[['冥想 10 分鐘','DIS',10,{slot:'am'}],['寫 3 行日記','INT',10,{slot:'pm'}]]]];
function wizard(first){const sel=new Set(['體能','作息','少滑手機']);let lv='easy';
 const chips=()=>GOALS.map(g=>`<button class="${sel.has(g[1])?'on':''}" data-g="${g[1]}">${g[0]} ${g[1]}</button>`).join('');
 const lvs=()=>[['easy','🌱 輕鬆','每類 1 項'],['std','⚔️ 標準','每類 2 項'],['hard','😈 硬派','2 項＋硬核']].map(x=>`<button class="${lv===x[0]?'on':''}" data-lv="${x[0]}">${x[1]}<div class="muted" style="font-size:11px">${x[2]}</div></button>`).join('');
 const draw=()=>{$('#wg').innerHTML=chips();$('#wl').innerHTML=lvs()};
 modal(`<h2>[系統] ${first?'玩家覺醒':'重新配置'}</h2><div class="bigt" style="font-size:22px">你想改變什麼？</div><p class="muted" style="margin:0">可以多選，之後都能在設定改。</p><div class="chipg" id="wg">${chips()}</div>
 <p class="muted" style="margin:10px 0 0">難度（剛開始建議輕鬆，少一點比較容易撐住）</p><div class="chipg" id="wl" style="flex-wrap:nowrap">${lvs()}</div>
 ${first?'<p class="muted" style="line-height:1.6;font-size:12px">每天完成 80% = 通關。任務給 XP 跟金幣，金幣在商店換獎勵。每週一隻 Boss，你的任務就是攻擊。</p>':'<p style="color:var(--red);font-size:12px">會取代目前的任務清單（等級、金幣不變）。</p>'}`,
 [...(first?[]:[['取消','btn']]),['產生計畫','btn pri',()=>{const qs=[];for(const g of GOALS)if(sel.has(g[1]))(lv==='easy'?g[2].slice(0,1):g[2]).forEach(([n,st,xp,o])=>qs.push(Object.assign({id:uid(),name:n,stat:st,xp},JSON.parse(JSON.stringify(o)))));
  if(!qs.length)return toast('至少選一類');S.quests=qs;if(lv==='hard'&&!S.hard){S.hard=true;S.lastClosed=addDays(today(),-1)}S.seen=1;after();toast(`<b>[系統]</b> 已產生 ${qs.length} 個每日任務`)}]]);
 $('#mcard').onclick=e=>{const b=e.target.closest('[data-g],[data-lv]');if(!b)return;if(b.dataset.g){sel.has(b.dataset.g)?sel.delete(b.dataset.g):sel.add(b.dataset.g)}else lv=b.dataset.lv;draw()}}
const VIEWS={today:vToday,battle:vBattle,shop:vShop,me:vMe,set:vSet};
function render(){header();$('#view').innerHTML=VIEWS[tab]();tick()}

/* ---------- 事件 ---------- */
$('#view').addEventListener('click',e=>{const el=e.target.closest('[data-q],[data-minus],[data-bonus],[data-day],[data-wd],[data-pen],[data-focus],[data-buy],[data-delq],[data-delr],button[id]');if(!el)return;const d=el.dataset;
 const D=viewY?addDays(today(),-1):today();
 if(d.q)return toggleQuest(d.q,D);
 if(d.minus)return minusQuest(d.minus,D);
 if(d.bonus)return toggleBonus(D);
 if(d.day){viewY=d.day==='y';return render()}
 if(d.wd){const q=S.quests.find(x=>x.id===d.wdq);let a=q.days&&q.days.length?q.days.slice():[0,1,2,3,4,5,6];const w=+d.wd;a=a.includes(w)?a.filter(x=>x!==w):a.concat(w).sort();q.days=a.length===7?undefined:a;if(!a.length)q.days=[w];save();return render()}
 if(d.pen){const p=S.penalties.find(x=>x.id===d.pen);return modal(`<h2>[懲罰任務]</h2><div class="bigt">${esc(p.text)}</div><p class="muted">誠實點，真的做完了？</p>`,[['還沒','btn'],['做完了','btn red',()=>{p.done=true;p.doneAt=Date.now();toast('<b>[系統]</b> 懲罰解除，商店開放');after()}]])}
 if(d.focus){S.timer={end:Date.now()+d.focus*6e4,min:+d.focus};save();toast(`<b>[專注地城]</b> 進入 ${d.focus} 分鐘`);return render()}
 if(d.buy){const r=S.rewards.find(x=>x.id===d.buy);if(!r)return;if(pendingPen().length)return toast('先完成懲罰任務');if(S.gold<r.cost)return toast('金幣不夠，回去解任務');
  return modal(`<h2>[確認購買]</h2><div class="bigt">${esc(r.name)}</div><p>花費 <span class="gold">${r.cost} G</span>，剩 <span class="gold">${S.gold-r.cost} G</span></p>`,
   [['算了','btn'],['買','btn pri',()=>{S.gold-=r.cost;S.buys.unshift({t:Date.now(),name:r.name,cost:r.cost});S.buys=S.buys.slice(0,50);after();sfx('lv');toast(`<b>已購買</b>　${esc(r.name)}，去享受吧`)}]])}
 if(d.delq){S.quests=S.quests.filter(q=>q.id!==d.delq);save();return render()}
 if(d.delr){S.rewards=S.rewards.filter(q=>q.id!==d.delr);save();return render()}
 switch(el.id){
  case'giveup':return modal('<h2>[專注地城]</h2><div class="bigt">確定逃跑？</div><p class="muted">不會有任何獎勵。</p>',[['繼續撐','btn pri'],['逃跑','btn red',()=>{S.timer=null;save();render()}]]);
  case'addq':S.quests.push({id:uid(),name:'新任務',stat:'DIS',xp:20,slot:'day'});save();return render();
  case'wiz':return wizard();
  case'tBadge':{if(!('setAppBadge'in navigator)){toast('這裡不支援，先「加入主畫面」再從主畫面打開');return}
   const on=()=>{S.badge=true;save();updBadge();render();toast('<b>已開啟</b>　圖示會顯示剩幾項')};
   if(S.badge){S.badge=false;try{navigator.clearAppBadge()}catch(e){}save();return render()}
   try{if(window.Notification&&Notification.permission!=='granted')Notification.requestPermission().then(p=>p==='granted'?on():toast('要允許通知才能顯示數字'));else on()}catch(e){on()}return}
  case'cpUrl':try{navigator.clipboard.writeText(location.href.split('#')[0]).then(()=>toast('<b>已複製</b>　'+esc(location.href.split('#')[0])),()=>toast(esc(location.href)))}catch(e){toast(esc(location.href))}return;
  case'addr':S.rewards.push({id:uid(),name:'新獎勵',cost:50});save();return render();
  case'tHard':S.hard=!S.hard;if(S.hard)S.lastClosed=addDays(today(),-1);return after();
  case'tSnd':S.sound=!S.sound;save();sfx('done');return render();
  case'exp':{const t=$('#bk');t.classList.remove('hide');$('#impGo').classList.add('hide');t.value=JSON.stringify(S);t.select();
   try{navigator.clipboard.writeText(t.value).then(()=>toast('<b>已複製</b>　貼到備忘錄存起來'),()=>toast('請手動複製下面的文字'))}catch(err){toast('請手動複製下面的文字')}return}
  case'imp':{const t=$('#bk');t.classList.remove('hide');t.value='';t.placeholder='把備份文字貼在這';$('#impGo').classList.remove('hide');return}
  case'impGo':try{const o=JSON.parse($('#bk').value);if(!o.quests)throw 0;S=Object.assign(defaults(),o);save();toast('<b>匯入成功</b>');render()}catch(err){toast('格式不對，確認有整段貼上')}return;
  case'restart':return modal('<h2>[重開計畫]</h2><div class="bigt">從 DAY 1 重新開始？</div><p class="muted">等級、金幣、成就保留，66 天進度歸零。</p>',[['取消','btn'],['重開','btn pri',()=>{S.start=today();S.lastClosed=null;S.penalties=[];save();render()}]]);
  case'wipe':return modal('<h2>[警告]</h2><div class="bigt" style="color:var(--red)">全部清空？</div><p class="muted">無法復原。建議先匯出備份。</p>',[['取消','btn'],['清空','btn red',()=>{S=defaults();save();render()}]]);
 }});
$('#view').addEventListener('change',e=>{if(e.target.id==='dayStart'){S.dayStart=+e.target.value;save();return render()}const f=e.target.dataset.f;if(!f)return;const qe=e.target.closest('[data-eq]'),re=e.target.closest('[data-er]');
 if(qe){const q=S.quests.find(x=>x.id===qe.dataset.eq);q[f]=f==='xp'||f==='goal'?+e.target.value:f==='target'?Math.max(1,Math.min(50,+e.target.value||1)):e.target.value;if(f==='type'){if(!q.type)delete q.type;else q.goal=q.goal||180;save();return render()}}
 if(re){const r=S.rewards.find(x=>x.id===re.dataset.er);r[f]=f==='name'?e.target.value:Math.max(0,+e.target.value||0)}
 save();header()});

/* ---------- 計時 ---------- */
function tick(){const tm=S.timer;
 if(tm){const left=tm.end-Date.now();
  if(left<=0){S.timer=null;const xp=Math.round(tm.min*0.8),g=Math.round(tm.min/2);S.stats.INT=(S.stats.INT||0)+1;S.focusCount++;dayLog(today()).focus.push({min:tm.min,xp,g});
   gain(xp,g);hitBoss(xp);after();modal(`<h2>[專注地城] 通關</h2><div class="bigt">${tm.min} 分鐘專注完成</div><p><b style="color:var(--cyan)">+${xp} XP</b>　<span class="gold">+${g} G</span>　智力 +1</p>`,[['讚','btn pri']]);return}
  const el=$('#tmr');if(el){const s=Math.ceil(left/1e3);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}}
}
setInterval(tick,1000);
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();closeDays();render()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){closeDays();render()}});

closeDays();bossInfo();checkAch();save();render();
try{if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
if(!S.seen)wizard(true);else askScreen();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.seen)askScreen()});
updBadge();
</script>
</body>
</html>
