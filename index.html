<title>RESET 系統</title>
<style>
:root{--bg:#05070d;--panel:#0b1120;--panel2:#0f1830;--line:#1c2a44;--cyan:#4fd1ff;--blue:#3b82f6;--gold:#f5c451;--red:#ff5d6c;--green:#3ee08f;--purple:#b48cff;--text:#e6eefc;--mute:#7d8aa6;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 72px);min-height:100vh;
 background:radial-gradient(ellipse at 50% -10%,rgba(59,130,246,.18),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#070c18;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
a{color:var(--cyan)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;gap:12px;padding:12px 14px 6px;max-width:560px;margin:0 auto}
.rank{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 22px var(--mono);
 border:1.5px solid var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(79,209,255,.35),inset 0 0 10px rgba(79,209,255,.15)}
.who{flex:1;min-width:0}
.who .l1{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.who .l1 b{color:var(--text);font-size:15px}
.bar{height:8px;background:#0a1222;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .5s}
.bar.red>i{background:linear-gradient(90deg,#b3263a,var(--red));box-shadow:0 0 10px var(--red)}

 else{sfx('bad');toast(`超標 ${m-g} 分鐘，明天再拚`)}

function openChest(big){const lk=1+.3*skl('luck');
 if(big){const pool=[];for(const k in GEAR)GEAR[k].items.slice(0,2).forEach(it=>{if(!S.gear.own.includes(it[0]))pool.push(it)});
  if(pool.length&&Math.random()<.5){const it=pool[Math.floor(Math.random()*pool.length)];giveGear(it[0]);jlog('🎁',`簽到大寶箱開出「${it[1]}」`);return{ic:'🗡️',txt:`稀有掉落：<b style="color:var(--gold)">${it[1]}</b>`}}
  const g=Math.round((100+Math.floor(Math.random()*81))*lk);S.gold+=g;return{ic:'💰',txt:`<span class="gold">+${g} G</span>`}}
 if(Math.random()<.3){const x=15+Math.floor(Math.random()*11);gain(x,0);return{ic:'✨',txt:`<b style="color:var(--cyan)">+${x} XP</b>`}}
 const g=Math.round((20+Math.floor(Math.random()*26))*lk);S.gold+=g;return{ic:'💰',txt:`<span class="gold">+${g} G</span>`}}
function checkLogin(then){const t=today();if(S.login.last===t)return false;const y=addDays(t,-1);
 S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=t;S.login.best=Math.max(S.login.best||0,S.login.streak);
 const k=(S.login.streak-1)%7,r=LOGIN[k];let res;
 if(r[0]==='g'){const g=Math.round(r[1]*(1+eqv('armor')));S.gold+=g;res={ic:'💰',txt:`<span class="gold">+${g} G</span>`}}else res=openChest(r[0]==='C');

function jlog(icon,text,type){S.journal=S.journal||[];S.journal.unshift({t:Date.now(),d:today(),icon,text,type:type||'sys'});if(S.journal.length>800)S.journal.length=800}

  for(const k in L.done||{}){q++;xp+=L.done[k].xp||0}for(const k in L.side||{}){side++;xp+=L.side[k].xp||0}(L.focus||[]).forEach(f=>xp+=f.xp||0)}
 const B=BOSS[p.idx];if(!days)return;
 jlog('📜',`第 ${chapOf(wk)} 章戰報｜通關 ${clr}/${days} 天・完成任務 ${q} 個・隨機任務 ${side} 個・獲得 ${xp} XP・Boss ${B.n}：${p.dead?'擊破':'敗北'}`,'report')}
const STREAK_MS=[3,7,14,21,30,45,66,100];

const CN='〇一二三四五六七八九';
const cnNum=n=>n<=10?(n===10?'十':CN[n]):n<20?'十'+CN[n%10]:CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:'');
const dateCN=d=>{const x=parse(d);return`${x.getMonth()+1} 月 ${x.getDate()} 日　星期${WD[x.getDay()]}`};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
function vLog(){const t=today(),sub=S.jtab||'book';
 let h=`<div class="seg jtab">${[['book','📖 日記本'],['ana','📊 分析']].map(([k,n])=>`<button class="${sub===k?'on':''}" data-jt="${k}">${n}</button>`).join('')}</div>`;
 if(sub==='ana'){h+=weekCmp()+lifetime()+insightPanel();const mood=[];for(let i=13;i>=0;i--){const d=addDays(t,-i),p=S.diary&&S.diary[d];mood.push([d,p&&p.mood!=null?p.mood:null])}
  if(mood.some(x=>x[1]!=null))h+=`<div class="panel"><div class="ptitle">[心情軌跡]<span>近 14 天</span></div><div class="mtrack">${mood.map(([d,m])=>`<div><span>${m!=null?MOODS[m]:'·'}</span><small>${parse(d).getDate()}</small></div>`).join('')}</div></div>`;

 return h+vBook()}

/* ---------- 冒險分析（統計日誌心情 × 任務紀錄） ---------- */
const mEmo=v=>MOODS[Math.max(0,Math.min(4,Math.round(v)))];
function insights(){const t=today(),M={};
 for(const d in S.diary||{}){const p=S.diary[d];if(p.mood!=null)M[d]=[p.mood]}const md=d=>M[d]?M[d].reduce((a,b)=>a+b,0)/M[d].length:null;
 const days=Object.keys(M).filter(d=>diff(d,t)<=60);if(days.length<5)return{need:5-days.length};
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,out=[];
 const cmp=(title,a,b,la,lb,good,meh)=>{if(a.length<2||b.length<2)return;const x=avg(a),y=avg(b),dv=x-y;
  out.push({title,txt:`${la}：${mEmo(x)} ${(x+1).toFixed(1)}　${lb}：${mEmo(y)} ${(y+1).toFixed(1)}`,note:Math.abs(dv)>=.5?(dv>0?good:meh):'差不多，看起來影響不大。'})};
 const g=f=>{const a=[],b=[];days.forEach(d=>{const r=f(d);if(r===true)a.push(md(d));else if(r===false)b.push(md(d))});return[a,b]};
 let[a,b]=g(d=>diff(S.start,d)>=0?cleared(d):null);cmp('通關的日子心情比較好嗎？',a,b,'通關','沒通關','做完任務的日子，你明顯比較開心。完成本身就是獎勵。','沒通關的日子反而心情比較好，可能任務太滿，壓力大。');
 [a,b]=g(d=>{const L=S.log[addDays(d,-1)];if(!L||!L.done)return null;return!!(L.done.sleep_off||L.done.sleep_on)});cmp('前一晚準時上床，隔天心情？',a,b,'有準時','沒準時','睡眠對你的影響很大，準時上床是你最值得守住的任務。','準時睡的隔天心情反而比較差，可以觀察是不是睡太早睡不著。');
 [a,b]=g(d=>{const L=S.log[d];if(!L||!L.done)return null;return!!L.done.train});cmp('有訓練的日子？',a,b,'有練','沒練','練完心情明顯比較好，訓練對你來說也是充電。','有練的日子心情比較差，注意是不是太累、恢復不夠。');
 const sc=days.map(d=>S.log[d]&&S.log[d].scr).filter(v=>v!=null).sort((x,y)=>x-y);
 if(sc.length>=4){const mid=sc[Math.floor(sc.length/2)];[a,b]=g(d=>{const v=S.log[d]&&S.log[d].scr;return v==null?null:v<=mid});cmp(`螢幕時間少（${fmtMin(mid)} 以下）的日子？`,a,b,'用得少','用得多','手機用得少的日子比較開心，滑越多不一定越放鬆。','用得多的日子心情反而比較好，也許那些時間是在跟朋友聯絡。')}
 [a,b]=g(d=>isShift(d));cmp('有班 vs 沒班？',a,b,'有班','沒班','上班的日子心情比較好，工作讓你有充實感。','上班的日子比較累，那幾天任務做迷你就好，別給自己太大壓力。');
 const r7=days.filter(d=>diff(d,t)<7).map(md),p7=days.filter(d=>diff(d,t)>=7&&diff(d,t)<14).map(md);
 if(r7.length>=2&&p7.length>=2){const x=avg(r7),y=avg(p7);out.unshift({title:'最近心情趨勢',txt:`這週 ${mEmo(x)} ${(x+1).toFixed(1)}　上週 ${mEmo(y)} ${(y+1).toFixed(1)}`,note:x-y>=.4?'這週狀態在往上 📈':y-x>=.4?'這週比較低落。可以回頭看日誌，找找是什麼在影響你。':'跟上週差不多，很穩。'})}
 const wd=[0,0,0,0,0,0,0].map(()=>[0,0]);for(let i=1;i<=28;i++){const d=addDays(t,-i);if(diff(S.start,d)<0)break;const w=parse(d).getDay();wd[w][1]++;if(cleared(d))wd[w][0]++}
 const ws=wd.map((x,i)=>[i,x[1]>=2?x[0]/x[1]:null]).filter(x=>x[1]!=null);
 if(ws.length>=4){ws.sort((x,y)=>y[1]-x[1]);const best=ws[0],worst=ws[ws.length-1];if(best[1]-worst[1]>=.3)out.push({title:'一週裡的節奏',txt:`最穩：週${WD[best[0]]}（${Math.round(best[1]*100)}%）　最容易失守：週${WD[worst[0]]}（${Math.round(worst[1]*100)}%）`,note:`週${WD[worst[0]]}可以提前做 WOOP，先想好那天會卡在哪。`})}
 return{list:out,n:days.length}}

const POKE=['……幹嘛？','我在修練。','別戳了，經驗值不會變多。','再戳我就要放火球了。','……','（裝死中）','你是不是很閒？去做任務。','最後警告。','我數到三。','💢 好啦！被你戳醒了！'];

function diaryWords(d,v){if(d!==today())return;S.eggSeen=S.eggSeen||{};for(const[re,k,msg]of WORDS){const key=d+re.source;if(re.test(v)&&!S.eggSeen[key]){S.eggSeen[key]=1;if(/心靈 \+1/.test(msg))S.stats.SPI++;if(k)setEgg(k);setTimeout(()=>toast(`<b>${msg}</b>`,'crit'),900);save();if(k)checkAch()}}}

let mQ=[];
function qModal(html,acts){mQ.push([html,acts]);pumpQ()}
function pumpQ(){if(!mQ.length)return;if($('#modal').classList.contains('on'))return setTimeout(pumpQ,700);const[h,a]=mQ.shift();modal(h,a);if(mQ.length)setTimeout(pumpQ,700)}
function hrand(str){let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);h^=h>>>16;h=Math.imul(h,2246822507);h^=h>>>13;h=Math.imul(h,3266489909);h^=h>>>16;return(h>>>0)/4294967296}
const mkRng=seed=>{let i=0;return()=>hrand(seed+'#'+(i++))};

/* ---------- 隨機裝備 ---------- */
const RAR=[['普通','#a3adc2',1,62],['稀有','#4fd1ff',1.25,28],['史詩','#b48cff',1.6,8.5],['傳說','#f5c451',2.2,1.5]];
const PREF=[[],['精鍛','銳利','堅固','迅捷'],['暗紋','龍骨','星鐵','血契'],['神諭','終焉','天命','君王']];
const AFX={xp:['經驗',.03,.08],crit:['暴擊率',.02,.04],gold:['金幣',.05,.10]};
const BAG_MAX=30;
function lootTier(){const L=lvInfo(S.xp).lv;return L<5?1:L<10?2:L<20?3:L<35?4:5}
function rollRar(r,good){const w=good?[0,62,30,8]:RAR.map(x=>x[3]),sum=w.reduce((a,b)=>a+b,0);let x=r*sum;for(let i=0;i<4;i++){x-=w[i];if(x<0)return i}return 3}
function makeLoot(rng,good){S.loot=S.loot||{};const slot=['weapon','armor','acc'][Math.floor(rng()*3)],tier=Math.min(5,lootTier()+(rng()<.1?1:0)),rar=rollRar(rng(),good),
 base=GEAR[slot].items[tier-1],v=Math.round(base[4]*RAR[rar][2]*(.9+rng()*.2)*1000)/1000,pf=PREF[rar],n=(pf.length?pf[Math.floor(rng()*pf.length)]:'')+base[1];
 let afx=null;if(rar>=2){const ks=Object.keys(AFX).filter(k=>!(slot==='armor'&&k==='gold')&&!(slot==='acc'&&k==='crit')),k=ks[Math.floor(rng()*ks.length)],a=AFX[k];afx={k,v:Math.round((a[1]+(a[2]-a[1])*rng())*(rar===3?1.5:1)*1000)/1000}}
 let id;do{id='L'+Date.now().toString(36)+Math.floor(rng()*1e6).toString(36)+Math.floor(Math.random()*1e3).toString(36)}while(S.loot[id]);
 S.loot[id]={slot,tier,rar,n,v,afx,t:Date.now()};S.gear.own.push(id);return id}
const affix=k=>['weapon','armor','acc'].reduce((a,s)=>{const g=eqItem(s);return a+(g&&g.afx&&g.afx.k===k?g.afx.v:0)},0);
const bagIds=()=>S.gear.own.filter(id=>id[0]==='L'&&S.loot&&S.loot[id]);
const salvageVal=x=>Math.round([15,40,100,250][x.rar]*(1+x.tier*.5));
function salvage(id,quiet){const x=S.loot[id];if(!x)return 0;const g=salvageVal(x);S.gold+=g;if(x.rar>=2)Object.keys(MATS).forEach(k=>S.mats[k]+=x.rar-1);
 S.gear.own=S.gear.own.filter(z=>z!==id);if(S.gear.eq[x.slot]===id)autoEquip(x.slot);if(S.stolen!==id)delete S.loot[id];if(!quiet)toast(`分解「${x.n}」 <span class="gold">+${g} G</span>${x.rar>=2?`　💎🦷✨ 各 +${x.rar-1}`:''}`);return g}
const lootScore=x=>x.rar*10+x.tier+x.v/GEAR[x.slot].items[x.tier-1][4]-1+(x.afx?.5:0);
function bagTrim(){const ids=bagIds();if(ids.length<=BAG_MAX)return;const eq=Object.values(S.gear.eq),best={};ids.forEach(id=>{const x=S.loot[id];if(!best[x.slot]||lootScore(x)>lootScore(S.loot[best[x.slot]]))best[x.slot]=id});
 const keep=new Set([...eq,...Object.values(best)]),c=ids.filter(id=>!keep.has(id)).sort((a,b)=>lootScore(S.loot[a])-lootScore(S.loot[b]));
 let g=0;while(bagIds().length>BAG_MAX&&c.length)g+=salvage(c.shift(),true);if(g)toast(`背包滿了，自動分解比較弱的裝備 <span class="gold">+${g} G</span>`)}
const gearName=(g,b)=>`<${b||'b'} style="color:${g&&g.rar!=null?RAR[g.rar][1]:'inherit'}">${g?esc(g.it[1]):'空'}</${b||'b'}>`;
function effTxt(slot,v,afx){return`${GEAR[slot].eff} +${Math.round(v*1000)/10}%`+(afx?`・${AFX[afx.k][0]} +${Math.round(afx.v*1000)/10}%`:'')}
function dropLoot(seed,good,src){const id=makeLoot(mkRng(seed),good),x=S.loot[id],cur=eqItem(x.slot),better=!cur||x.v>cur.it[4];if(better)S.gear.eq[x.slot]=id;
 jlog('🎁',`${src}掉落 ${RAR[x.rar][0]}裝備「${x.n}」`);bagTrim();
 const html=`<div class="lootc r${x.rar}"><div class="lootrar">${RAR[x.rar][0]}</div><div class="lootic">${gearIcon(x.slot,x.tier)}</div><div class="lootn" style="color:${RAR[x.rar][1]}">${esc(x.n)}</div><div class="muted">${GEAR[x.slot].n}・T${x.tier}</div><div class="lootfx">${effTxt(x.slot,x.v,x.afx)}</div>${better?'<div class="lootok">已自動裝備</div>':cur?`<div class="muted" style="font-size:12px">目前裝的「${esc(cur.it[1])}」比較強，先放背包</div>`:''}</div>`;
 if(x.rar>=2){sfx('lv');qModal(`<h2>[${src}] 戰利品</h2>${html}`,[['收下','btn pri',()=>after()]]);if(x.rar===3&&setEgg('legend'))checkAch()}
 else{sfx('chest');setTimeout(()=>toast(`<b style="color:${RAR[x.rar][1]}">🎁 ${RAR[x.rar][0]}・${esc(x.n)}</b>　${better?'已裝備':'放進背包'}`,'crit'),500)}
 return id}
function maybeDrop(t,key,kind){if(t!==today())return;const k=t+'|'+key,ch={quest:.05,side:.05,focus:.08}[kind];if(!ch)return;S.lootKeys=S.lootKeys||{};if(S.lootKeys[k])return;
 if(hrand(k+'drop')<ch){S.lootKeys[k]=1;dropLoot(k,false,kind==='focus'?'專注':'任務')}}
function pruneLootKeys(){const t=today();for(const k in S.lootKeys||{})if(diff(k.slice(0,10),t)>3)delete S.lootKeys[k]}

/* ---------- 夥伴 ---------- */
const PETS={dragon:{n:'炎龍',stat:'STR',c:'#fb923c',ic:['salamander','wyvern','spiked-dragon-head','hydra'],sn:['火蜥','飛龍','炎角龍','九頭炎龍'],d:'身體系任務 XP 加成'},
 fox:{n:'靈狐',stat:'INT',c:'#a78bfa',ic:['fox','fox-head','wolf-howl','wolf-head'],sn:['幼狐','靈狐','月嚎狐','天狼'],d:'智力系任務 XP 加成'},
 bird:{n:'靈鳥',stat:'SPI',c:'#34d399',ic:['kiwi-bird','raven','egyptian-bird','griffin-symbol'],sn:['雛鳥','靈鴉','蒼鷹','獅鷲王'],d:'心靈系任務 XP 加成'}};
const PSTAGE=[0,3,10,25,50],PMOOD=[['虛弱','😵'],['難過','😢'],['普通','🙂'],['開心','😆']];
function petInit(){if(!S.pet)S.pet={born:S.start,max:0,sp:null}}
function petCalc(){const P=S.pet;if(!P)return null;const t=today(),y=addDays(t,-1);let b=0,d=P.born,n=0;
 while(d<y&&n<3000){if(cleared(d))b++;else b=Math.max(0,b-2);d=addDays(d,1);n++}
 if(P.born<=y&&cleared(y))b++;if(P.born<=t&&cleared(t))b++;
 let st=0;PSTAGE.forEach((x,i)=>{if(b>=x)st=i});const stage=Math.max(st,P.max||0);
 const c=dd=>P.born<=dd&&cleared(dd),y2=addDays(t,-2);let mood=2;
 if(cleared(t))mood=3;else if(P.born<=y2&&!c(y)&&!c(y2))mood=0;else if(P.born<=y&&!c(y))mood=1;
 return{b,st,stage,mood,next:PSTAGE[stage+1],prev:PSTAGE[stage]}}
const petBuff=()=>{const P=S.pet,c=P&&P.sp&&petCalc();return c&&c.stage>=1&&c.mood>0?.05*c.stage:0};
function petName(){const P=S.pet,c=petCalc();if(!P)return'';if(!P.sp||c.stage<1)return'神秘的蛋';return PETS[P.sp].sn[c.stage-1]}
function petSvg(w,big){const P=S.pet,c=petCalc();if(!P)return'';const g=rid();
 if(!P.sp||c.stage<1){return`<svg viewBox="0 0 512 512" width="${w}" class="petsvg egg"><defs><radialGradient id="e${g}"><stop offset="0" stop-color="#e0f2fe" stop-opacity=".55"/><stop offset="1" stop-color="#e0f2fe" stop-opacity="0"/></radialGradient></defs><circle cx="256" cy="270" r="250" fill="url(#e${g})"/>${icoPaths('cosmic-egg','#dbeafe')}</svg>`}
 const p=PETS[P.sp],col=c.mood===0?'#6b7280':p.c,sc=[0,.62,.76,.88,1][c.stage],off=256*(1-sc);
 return`<svg viewBox="0 0 512 512" width="${w}" class="petsvg ${c.mood===0?'weak':c.mood===3?'happy':''}"><defs><radialGradient id="p${g}"><stop offset="0" stop-color="${col}" stop-opacity="${.25+c.stage*.08}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient><linearGradient id="q${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${col}"/><stop offset="1" stop-color="${col}" stop-opacity=".75"/></linearGradient></defs>
 <circle cx="256" cy="256" r="${200+c.stage*14}" fill="url(#p${g})"/>${c.stage>=4&&big?`<circle cx="256" cy="256" r="236" fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="4" stroke-dasharray="6 18"/>`:''}
 <g transform="translate(${off} ${off}) scale(${sc})">${icoPaths(p.ic[c.stage-1],`url(#q${g})`)}</g></svg>`}
function petCheck(){const P=S.pet;if(!P)return;const c=petCalc();if(c.stage<=(P.max||0))return;const from=P.max||0;P.max=c.stage;save();
 if(from===0&&!P.sp){sfx('lv');jlog('🥚','蛋裂開了');return qModal(`<h2>[系統] 蛋裂開了</h2><div style="text-align:center">${petSvg(140)}</div><div class="bigt" style="text-align:center;font-size:20px">選擇你的夥伴</div><p style="text-align:center;margin:6px 0">${Object.values(PETS).map(p=>`<b style="color:${p.c}">${p.n}</b><small class="muted">＝${STATS[p.stat].n}</small>`).join('　')}</p><p class="muted" style="text-align:center;font-size:12px;margin:4px 0 0">選了就不能換。你通關，牠就長大；你斷掉，牠會變虛弱。</p>`,

 for(const f of[.33,.66,1])s+=`<polygon points="${ks.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#1c2a44"/>`;
 ks.forEach((k,i)=>{const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1c2a44"/>`;const[lx,ly]=pt(i,R+15);s+=`<text x="${lx}" y="${ly+4}" fill="${STATS[k].c}" font-size="11" text-anchor="middle">${STATS[k].n}</text>`});

   jDraft='';S.jm=null;if(S.jxp!==today()){S.jxp=today();S.stats.SPI=(S.stats.SPI||0)+1;gain(10,0);toast('<b>[勇者日誌]</b> 今天第一篇 +10 XP　心靈 +1')}else toast('<b>已寫入日誌</b>');sfx('done');return after()}
  case'fight':return startFight();
  case'giveup':return modal(`<h2>[專注討伐]</h2><div style="text-align:center">${minionSvg(dun().floor,110)}</div><div class="bigt" style="text-align:center">要逃跑嗎？</div><p class="muted" style="text-align:center">逃跑＝放棄這場專注。不會有獎勵，${esc(minionOf(dun().floor).n)}也還在。</p>`,[['繼續戰鬥','btn pri'],['🏃 逃跑','btn red',()=>{toast('成功逃走了……下次再來');const L=dayLog(today());L.quit=(L.quit||0)+1;S.timer=null;timerCancel();save();render()}]]);
  case'tHard':S.hard=!S.hard;if(S.hard)S.lastClosed=addDays(today(),-1);return after();
  case'tSnd':S.sound=!S.sound;save();sfx('done');return render();
  case'tBadge':{if(!('setAppBadge'in navigator)){toast('這裡不支援，先「加入主畫面」再從主畫面打開');return}
   const on=()=>{S.badge=true;save();updBadge();render();toast('<b>已開啟</b>')};
   if(S.badge){S.badge=false;try{navigator.clearAppBadge()}catch(e){}save();return render()}
   try{if(window.Notification&&Notification.permission!=='granted')Notification.requestPermission().then(p=>p==='granted'?on():toast('要允許通知才能顯示數字'));else on()}catch(e){on()}return}
  case'cpUrl':{const u=location.href.split('#')[0];try{navigator.clipboard.writeText(u).then(()=>toast('<b>已複製</b>　'+esc(u)),()=>toast(esc(u)))}catch(e){toast(esc(u))}return}
  case'bkFile':return backupFile();
  case'rsFile':return $('#rsInput').click();
  case'exp':{S.lastBackup=Date.now();save();const t=$('#bk');t.classList.remove('hide');$('#impGo').classList.add('hide');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('<b>已複製</b>　貼到備忘錄存起來'),()=>toast('請手動複製下面的文字'))}catch(err){toast('請手動複製下面的文字')}return}
  case'imp':{const t=$('#bk');t.classList.remove('hide');t.value='';t.placeholder='把備份文字貼在這';$('#impGo').classList.remove('hide');return}
  case'impGo':try{const o=JSON.parse($('#bk').value);if(!o.log)throw 0;return restoreData(o);localStorage.setItem(KEY,JSON.stringify(o));load();save();toast('<b>匯入成功</b>');render()}catch(err){toast('格式不對，確認有整段貼上')}return;
  case'restart':return modal('<h2>[重開計畫]</h2><div class="bigt">從 DAY 1 重新開始？</div><p class="muted">等級、金幣、裝備、成就保留，100 天進度歸零。</p>',[['取消','btn'],['重開','btn pri',()=>{S.start=today();S.lastClosed=null;S.penalties=[];save();render()}]]);
  case'wipe':return modal('<h2>[警告]</h2><div class="bigt" style="color:var(--red)">全部清空？</div><p class="muted">無法復原。建議先匯出備份。</p>',[['取消','btn'],['清空','btn red',()=>{S=defaults();S.seen=1;save();render()}]]);
 }});
$('#view').addEventListener('input',e=>{if(e.target.id==='fmin'){S.fmin=+e.target.value;fUpd()}});
$('#view').addEventListener('keydown',e=>{if(e.target.id==='xtxt'&&e.key==='Enter'){e.preventDefault();openExtra(viewY?addDays(today(),-1):today(),(e.target.value||'').trim())}});
$('#view').addEventListener('change',e=>{if(e.target.id==='jsys'){S.jsys=e.target.checked;save();return render()}if(e.target.id==='fmin'){save();return}if(e.target.id==='rsInput'){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.log)throw 0;restoreData(o)}catch(err){toast('這個檔案不是 RESET 的備份')}};rd.readAsText(f);e.target.value='';return}
 if(e.target.id==='dayStart'){S.dayStart=+e.target.value;save();return render()}
});

/* ---------- 計時 ---------- */
function tick(){const tm=S.timer;if(!tm)return;const left=tm.end-Date.now();
 if(left<=0){S.timer=null;fxSound('crit');haptic(3);S.maxFocus=Math.max(S.maxFocus||0,tm.min);const f0=dun().floor;const t=today(),fc=FCATS[tm.cat||'study'],L0=dayLog(t),combo=1+Math.min(3,L0.focus.length)*.2,q=fTask(tm.cat||'study',t);S.focusCount++;
  const qid=FQ[tm.cat||'study'],qq=qid&&QUESTS.find(x=>x.id===qid);L0.mins=L0.mins||{};
  if(qq&&activeOn(qq,t)){const dd=L0.done[qid];L0.mins[qid]=(L0.mins[qid]!=null?L0.mins[qid]:(dd&&dd.amt||0))+tm.min}
  const cum=qq?L0.mins[qid]||tm.min:tm.min;
  const mk=Object.keys(MATS)[Math.floor(Math.random()*3)];S.mats[mk]++;
  if(q){const lv=fLv(q,cum),was=cleared(t),r=reward(t,q.id+'L'+lv+'F',Math.round(q.xp*ELV[lv][1]*1.5*combo),q.stat,'quest');r.lv=lv;r.amt=cum;r.focus=1;L0.done[q.id]=r;
   L0.focus.push({min:tm.min,xp:0,cat:tm.cat,q:q.id});jlog('⚔️',`專注 ${fmtF(tm.min)} 完成「${q.name}」${ELV[lv][0]}`);settle(t,was);after();
   modal(`<h2>[專注完成]</h2>${focusHit(f0,'+'+r.xp+' XP',dun().floor>f0)}<div class="bigt" style="text-align:center">${fc[0]} 完成「${esc(q.name)}」${ELV[lv][0]}</div><p style="text-align:center;line-height:1.8"><b style="color:var(--cyan)">+${r.xp} XP</b>　<span class="gold">+${r.gold} G</span>　${MATS[mk][0]}×1<br><span class="muted sm">專注加成 ×1.5${combo>1?`・連戰 ×${combo.toFixed(1)}`:''}</span></p>`,[['☕ 休息 5 分鐘','btn',()=>startBreak(5)],['讚','btn pri']]);return}
  if(qq&&L0.done[qid]&&L0.done[qid].lv!=null){const dd=L0.done[qid],nl=fLv(qq,cum);
   if(nl>dd.lv){const u=upgradeQuest(qq,t,nl,1.5*combo,cum);L0.focus.push({min:tm.min,xp:0,cat:tm.cat,q:qid});after();
    modal(`<h2>[專注完成]</h2>${focusHit(f0,'+'+u.r.xp+' XP',dun().floor>f0)}<div class="bigt" style="text-align:center">${fc[0]}「${esc(qq.name)}」升級到${ELV[nl][0]}</div><p style="text-align:center;line-height:1.8">今天累計 <b>${cum}</b> 分鐘<br><b style="color:var(--cyan)">+${u.r.xp} XP</b>　<span class="gold">+${u.r.gold} G</span>　${MATS[mk][0]}×1</p>`,[['☕ 休息 5 分鐘','btn',()=>startBreak(5)],['讚','btn pri']]);return}
   dd.amt=cum}
  const r=reward(t,'focus'+Date.now(),focusXP(tm.min),fc[2],'focus');L0.focus.push({min:tm.min,xp:r.xp,cat:tm.cat});
  const m=minionOf(dun().floor),weak=m.w===fc[2],hit=Math.round(tm.min*3*combo);hitMinion(hit,'focus',fc[2]);jlog('⚔️',`專注討伐：${fc[1]} ${fmtF(tm.min)}`);after();
  modal(`<h2>[專注完成]</h2>${focusHit(f0,'-'+hit*(weak?2:1),dun().floor>f0)}<div class="bigt" style="text-align:center">${fc[0]} ${fc[1]} ${fmtF(tm.min)}</div><p style="text-align:center;line-height:1.8"><b style="color:var(--cyan)">+${r.xp} XP</b>　<span class="gold">+${r.gold} G</span>　${MATS[mk][0]}×1<br>重擊 <b>${hit*(weak?2:1)}</b>${weak?'（弱點 ×2）':''}${combo>1?`・連戰 ×${combo.toFixed(1)}`:''}</p>`,[['☕ 休息 5 分鐘','btn',()=>startBreak(5)],['讚','btn pri']]);return}
 const el=$('#tmr');if(el){const s=Math.ceil(left/1e3);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}focusRing()}
setInterval(tick,1000);
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();closeDays();render();checkLogin(askScreen)}},30000);
document.addEventListener('visibilitychange',()=>{try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update())}catch(e){}if(!document.hidden&&S.seen){closeDays();bossInfo();render();if(!$('#modal').classList.contains('on'))boot()}});

/* ---------- 啟動 ---------- */
if(!S.journal){S.journal=[];jlog('🌅','冒險開始。100 天後，成為更好的自己。')}
if(S.bossKills===undefined)S.bossKills=0;S.chap=S.chap||{};if(S.boss.week&&S.chap[S.boss.week]==null&&S.boss.idx!==undefined)S.chap[S.boss.week]=S.boss.idx;
{const ON=['怠惰之王','無限滑動獸','拖延巨像','宵夜惡龍','熬夜幽靈','藉口魔偶','沙發吸血鬼'],MN=['墮夢君主','藍屏巨蛇','明日巨像','暴食炎龍','不眠亡靈','千面傀儡師','沙發伯爵'];
 for(const k in S.chap){const v=S.chap[k];if(typeof v==='string'){let i=ON.indexOf(v);if(i<0)i=MN.indexOf(v);if(i<0)i=BOSS.findIndex(b=>b.n===v);S.chap[k]=i<0?null:i}}
 if(!S.jnameFix){(S.journal||[]).forEach(e=>{if(e.type==='user')return;[ON,MN].forEach(L=>L.forEach((n,i)=>{e.text=e.text.split(n).join(BOSS[i].n)}))});S.jnameFix=1}}
dun();migrateDiary();petInit();pruneLootKeys();closeDays();bossInfo();checkAch();save();render();updBadge();
try{if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
function boot(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 {const h=new Date().getHours();if(h>=1&&h<4&&S.seen){const f=setEgg('owl');setTimeout(()=>{fxSound('alarm');haptic(3);notice('🦉','[系統] 偵測到熬夜',`現在 ${new Date().getHours()} 點了。睡覺也是任務。<br>${S.pet&&S.pet.sp?esc(petName())+'已經睡著了，':''}放下手機，明天再戰。`,'red')},2500);checkAch()}
  const se=season();if(se&&S.seen&&S.seasonSeen!==today()){S.seasonSeen=today();if(setEgg('season'))checkAch();jlog(se[2],`${se[3]}開始！${se[4]}`);setTimeout(()=>notice(se[2],`${se[3]}開始了`,se[4],'gold'),3000);save()}}
if(S.pendingMsg){const h=S.pendingMsg;S.pendingMsg=null;save();sfx('bad');modal(h,[['可惡','btn red',()=>{if(!checkLogin(askScreen))askScreen()}]]);return}
 if(!checkLogin(()=>{askScreen()}))askScreen();setTimeout(()=>{if(!$('#modal').classList.contains('on'))askBackup()},1500);setTimeout(()=>{petCheck();mapCheck();save();render()},1000)}
if(!S.seen)modal(`<h2>[系統] 玩家覺醒</h2><div style="text-align:center">${avatarSvg(220)}</div><div class="bigt" style="text-align:center">歡迎來到 RESET</div><p class="muted" style="line-height:1.7">這是 100 天的冒險。第一週是新手村暖身週，下個週一正式開始。<br>每天完成 75% 任務＝通關。錯過一天不會斷，連續兩天才會。狀態差就做迷你版，也算。<br>任務給你 XP 和金幣；專注討伐打小怪；週末用整週累積的蓄力打 Boss。<br>通關 3 天會孵出夥伴，Lv.3 可以轉職。<br>有上班的日子記得切「有班」。</p>`,[['開始','btn pri',()=>{S.seen=1;save();boot()}]]);
else boot();



</script>
